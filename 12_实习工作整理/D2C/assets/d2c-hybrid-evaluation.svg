<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">D2C 混合视觉评估</title>
  <desc id="desc">D2C 视觉还原度评估融合确定性 checker 和 VLM 语义判断。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">D2C 视觉还原度：确定性 Checker 给精确证据，VLM 给语义判断</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">VLM 单次总分不能直接作为准出标准；必须结合组件匹配、OCR、像素与结构证据。</text><rect x="72" y="200" width="260" height="150" rx="8" fill="#E8F0FF" stroke="#93B4F5"/><text x="202.0" y="236" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">Figma 目标图</text><text x="202.0" y="266" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="202.0" dy="0">设计截图</tspan><tspan x="202.0" dy="22">节点 / viewport / 状态</tspan></text><rect x="72" y="470" width="260" height="150" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/><text x="202.0" y="506" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">D2C 渲染图</text><text x="202.0" y="536" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="202.0" dy="0">页面截图</tspan><tspan x="202.0" dy="22">结构树 / 同批次状态</tspan></text><path d="M332 275 C400 275 390 350 450 350" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M332 545 C400 545 390 470 450 470" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="458" y="190" width="330" height="190" rx="8" fill="#F1EAFE" stroke="#B69AE8"/><text x="623.0" y="226" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">确定性证据</text><text x="623.0" y="256" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="623.0" dy="0">组件一对一匹配</tspan><tspan x="623.0" dy="22">尺寸 / 位置 / 间距</tspan><tspan x="623.0" dy="22">颜色 / 圆角 / 字体</tspan><tspan x="623.0" dy="22">OCR 文本与数字</tspan></text><rect x="458" y="450" width="330" height="190" rx="8" fill="#FFF4DD" stroke="#E4B55B"/><text x="623.0" y="486" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">VLM 语义评估</text><text x="623.0" y="516" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="623.0" dy="0">布局协调与整体结构</tspan><tspan x="623.0" dy="22">文本缺失 / 多出 / 截断</tspan><tspan x="623.0" dy="22">差异解释与不确定性</tspan><tspan x="623.0" dy="22">多次运行 mean / std / range</tspan></text><path d="M788 285 C850 285 850 390 920 390" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><path d="M788 545 C850 545 850 450 920 450" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow-orange)"/><rect x="928" y="300" width="260" height="250" rx="8" fill="#172033" stroke="#172033"/><text x="1058.0" y="336" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">证据融合</text><text x="1058.0" y="366" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1058.0" dy="0">按 rubric 分子项</tspan><tspan x="1058.0" dy="22">checker 优先精确属性</tspan><tspan x="1058.0" dy="22">VLM 补语义与解释</tspan><tspan x="1058.0" dy="22">保留冲突和来源</tspan><tspan x="1058.0" dy="22">输出结构化报告</tspan></text><line x1="1188" y1="425" x2="1240" y2="425" stroke="#15803D" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="1248" y="352" width="120" height="146" rx="8" fill="#ECFDF3" stroke="#86D3A0"/><text x="1308.0" y="388" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">准出</text><text x="1308.0" y="418" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1308.0" dy="0">通过</tspan><tspan x="1308.0" dy="22">阻断</tspan><tspan x="1308.0" dy="22">人工复核</tspan></text><rect x="72" y="704" width="1296" height="140" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="100" y="744" fill="#172033" font-size="19" font-weight="700" text-anchor="start">稳定性门禁</text><text x="100" y="784" fill="#2563EB" font-size="15" font-weight="700" text-anchor="start">输入可比</text><text x="100" y="811" fill="#607086" font-size="13" font-weight="400" text-anchor="start">同页面、同状态、同 viewport</text><text x="412" y="784" fill="#6D28D9" font-size="15" font-weight="700" text-anchor="start">版本冻结</text><text x="412" y="811" fill="#607086" font-size="13" font-weight="400" text-anchor="start">模型 / Prompt / rubric / checker</text><text x="724" y="784" fill="#B45309" font-size="15" font-weight="700" text-anchor="start">结果拆分</text><text x="724" y="811" fill="#607086" font-size="13" font-weight="400" text-anchor="start">Layout 4 项 + Text 3 项</text><text x="1036" y="784" fill="#0F766E" font-size="15" font-weight="700" text-anchor="start">可回放</text><text x="1036" y="811" fill="#607086" font-size="13" font-weight="400" text-anchor="start">case、证据、差异与 GT 版本</text>
  </g>
</svg>
