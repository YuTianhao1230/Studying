<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">关键帧检测训练阶段</title>
  <desc id="desc">关键帧检测从任务治理、baseline、SFT、CoT 到条件式 GRPO 或 Temporal-OPSD，再进入评测回流。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">关键帧训练路线：每个阶段都有准入、准出与条件路由</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">先统一任务和 GT，再建立基础能力；GRPO 与 Temporal-OPSD 只在对应瓶颈成立时进入。</text><rect x="72" y="174" width="180" height="132" rx="8" fill="#E8F0FF" stroke="#2563EB"/><text x="162.0" y="210" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">0 任务与数据</text><text x="162.0" y="240" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="162.0" dy="0">完成态 / 时间坐标</tspan><tspan x="162.0" dy="22">GT 与切分</tspan></text><rect x="276" y="174" width="180" height="132" rx="8" fill="#F1EAFE" stroke="#6D28D9"/><text x="366.0" y="210" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">1 Baseline</text><text x="366.0" y="240" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="366.0" dy="0">规则 / Base / Prompt</tspan><tspan x="366.0" dy="22">固定回归集</tspan></text><rect x="480" y="174" width="180" height="132" rx="8" fill="#E7F8F4" stroke="#0F766E"/><text x="570.0" y="210" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">2 Direct SFT</text><text x="570.0" y="240" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="570.0" dy="0">视频输入</tspan><tspan x="570.0" dy="22">稳定短答案</tspan></text><rect x="684" y="174" width="180" height="132" rx="8" fill="#FFF4DD" stroke="#B45309"/><text x="774.0" y="210" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">3 CoT-SFT</text><text x="774.0" y="240" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="774.0" dy="0">状态 / 事件 / 证据</tspan><tspan x="774.0" dy="22">首次完成边界</tspan></text><line x1="252" y1="240" x2="268" y2="240" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><line x1="456" y1="240" x2="472" y2="240" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><line x1="660" y1="240" x2="676" y2="240" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M864 240 C900 240 900 392 918 392" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow-orange)"/><rect x="926" y="334" width="210" height="118" rx="8" fill="#F1EAFE" stroke="#B69AE8"/><text x="1031.0" y="370" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">4 GRPO</text><text x="1031.0" y="400" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1031.0" dy="0">可验证决策偏差</tspan><tspan x="1031.0" dy="22">verifier 可靠且有方差</tspan></text><rect x="1158" y="334" width="210" height="118" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/><text x="1263.0" y="370" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">5 Temporal-OPSD</text><text x="1263.0" y="400" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1263.0" dy="0">局部证据稀释</tspan><tspan x="1263.0" dy="22">Teacher 有优势和 logits</tspan></text><path d="M864 240 C1040 240 1040 310 1260 326" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow-orange)"/><path d="M1031 452 C1031 540 760 520 760 592" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><path d="M1263 452 C1263 560 860 520 860 592" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="580" y="600" width="460" height="118" rx="8" fill="#ECFDF3" stroke="#86D3A0"/><text x="810.0" y="636" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">6 固定评测 → Bad Case 回流 → 上线</text><text x="810.0" y="666" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="810.0" dy="0">全量 / 业务分桶 / early-late / 格式 / 成本</tspan><tspan x="810.0" dy="22">GT、规则、数据、视觉输入与模型能力分开归因</tspan></text><rect x="72" y="756" width="1296" height="88" rx="8" fill="#172033"/><text x="100" y="790" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="start">方法选择</text><text x="240" y="790" fill="#D7DFEA" font-size="15" font-weight="400" text-anchor="start">基础能力缺失 → Direct SFT</text><text x="530" y="790" fill="#D7DFEA" font-size="15" font-weight="400" text-anchor="start">缺边界证据 → CoT-SFT</text><text x="800" y="790" fill="#D7DFEA" font-size="15" font-weight="400" text-anchor="start">决策偏差 → GRPO</text><text x="1030" y="790" fill="#D7DFEA" font-size="15" font-weight="400" text-anchor="start">局部证据稀释 → OPSD</text><text x="720" y="823" fill="#D7DFEA" font-size="14" font-weight="400" text-anchor="middle">任何阶段都不能只用训练 loss、reward 或 Teacher 指标宣告收益。</text>
  </g>
</svg>
