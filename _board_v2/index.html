<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studying 知识看板 · 设计原型</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand" id="brand">
        <div class="brand-logo">S</div>
        <div class="brand-text">
          <div class="brand-title">Studying</div>
          <div class="brand-sub">知识看板 · 设计原型</div>
        </div>
      </div>

      <div class="search-box">
        <span class="search-ico">⌕</span>
        <input id="searchInput" type="text" placeholder="搜索笔记 / 正文 / 路径" autocomplete="off">
        <span class="kbd-hint">Ctrl K</span>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-foot">
        <span id="statFoot">—</span>
        <a href="#/" id="brandFoot">知识库</a>
      </div>
    </aside>

    <!-- 主区 -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" title="目录">☰</button>
        <div class="crumb"><span id="crumbMain">总览</span></div>
        <div class="spacer"></div>
        <button class="icon-btn" id="tocBtn" title="目录">☰</button>
        <button class="icon-btn" id="themeBtn" title="主题">☾</button>
      </header>

      <div class="body-wrap">
        <section class="view" id="view">
          <div class="view-inner" id="viewInner"></div>
        </section>
        <aside class="toc" id="toc"></aside>
      </div>
    </main>
  </div>

  <button class="to-top" id="toTop" title="回到顶部">↑</button>
  <div class="toast" id="toast"></div>

  <!-- 数据 + 渲染引擎（自包含，便于独立预览/部署） -->
  <script src="assets/data.js"></script>
  <script src="assets/md.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
