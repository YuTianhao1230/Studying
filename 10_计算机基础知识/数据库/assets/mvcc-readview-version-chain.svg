<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">MVCC ReadView 与版本链</title>
  <desc id="desc">展示当前行版本不可见时沿 undo 链寻找可见版本，并对比 Read Committed 每条语句创建 ReadView 与 Repeatable Read 复用 ReadView。</desc>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#607086"/></marker></defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700">MVCC：ReadView 决定“这次快照读能看见哪个版本”</text>
    <text x="72" y="101" fill="#607086" font-size="18">当前版本不可见时，不必阻塞写事务，而是沿 undo 版本链寻找更早的可见版本。</text>

    <rect x="72" y="146" width="1296" height="390" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="184" fill="#172033" font-size="21" font-weight="700">版本链与可见性判断</text>
    <g transform="translate(100 226)">
      <rect width="248" height="128" rx="8" fill="#F1EAFE" stroke="#B69AE8"/>
      <text x="124" y="34" text-anchor="middle" fill="#5720A3" font-size="18" font-weight="700">ReadView</text>
      <text x="24" y="67" fill="#6A4B93" font-size="14">creator_trx_id = 25</text>
      <text x="24" y="91" fill="#6A4B93" font-size="14">m_ids = {30, 35}</text>
      <text x="24" y="115" fill="#6A4B93" font-size="14">min = 30，max = 40</text>
      <line x1="248" y1="64" x2="306" y2="64" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="306" width="244" height="128" rx="8" fill="#FEE2E2" stroke="#F2A7A7"/>
      <text x="428" y="34" text-anchor="middle" fill="#B91C1C" font-size="18" font-weight="700">当前版本 V3</text>
      <text x="428" y="67" text-anchor="middle" fill="#7F1D1D" font-size="14">trx_id = 35</text>
      <text x="428" y="91" text-anchor="middle" fill="#7F1D1D" font-size="14">在 m_ids 中</text>
      <text x="428" y="115" text-anchor="middle" fill="#B91C1C" font-size="14" font-weight="700">不可见</text>
      <line x1="550" y1="64" x2="608" y2="64" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="608" width="244" height="128" rx="8" fill="#FFF4DD" stroke="#E4B55B"/>
      <text x="730" y="34" text-anchor="middle" fill="#92400E" font-size="18" font-weight="700">undo 版本 V2</text>
      <text x="730" y="67" text-anchor="middle" fill="#805B28" font-size="14">trx_id = 32</text>
      <text x="730" y="91" text-anchor="middle" fill="#805B28" font-size="14">不在 m_ids 中</text>
      <text x="730" y="115" text-anchor="middle" fill="#0F766E" font-size="14" font-weight="700">可见：返回此版本</text>
      <line x1="852" y1="64" x2="910" y2="64" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="910" width="244" height="128" rx="8" fill="#CCFBF1" stroke="#7BC7B9"/>
      <text x="1032" y="34" text-anchor="middle" fill="#0B5E57" font-size="18" font-weight="700">更早版本 V1</text>
      <text x="1032" y="67" text-anchor="middle" fill="#356C67" font-size="14">trx_id = 18</text>
      <text x="1032" y="91" text-anchor="middle" fill="#356C67" font-size="14">小于 min_trx_id</text>
      <text x="1032" y="115" text-anchor="middle" fill="#0F766E" font-size="14">同样可见</text>
    </g>
    <rect x="100" y="386" width="1240" height="116" rx="6" fill="#E8EEF5"/>
    <text x="124" y="418" fill="#172033" font-size="16" font-weight="700">判断顺序</text>
    <text x="124" y="450" fill="#425066" font-size="14">本事务版本 → 可见；trx_id &lt; min → 可见；trx_id ≥ max → 不可见；中间区间看是否在活跃集合 m_ids。</text>
    <text x="124" y="478" fill="#425066" font-size="14">当前版本不可见时继续沿 undo 链；找不到可见版本才表示该行在本快照中不存在。</text>

    <text x="72" y="598" fill="#172033" font-size="22" font-weight="700">RC 与 RR 的关键差别：ReadView 创建时机</text>
    <rect x="72" y="628" width="628" height="202" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="666" fill="#1D4ED8" font-size="20" font-weight="700">Read Committed</text>
    <g transform="translate(100 704)">
      <rect width="160" height="60" rx="6" fill="#DBEAFE"/><text x="80" y="26" text-anchor="middle" fill="#1D4ED8" font-size="14" font-weight="700">SELECT 1</text><text x="80" y="47" text-anchor="middle" fill="#42669B" font-size="12">创建 View A</text>
      <line x1="160" y1="30" x2="208" y2="30" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="208" width="160" height="60" rx="6" fill="#FFF4DD"/><text x="288" y="26" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700">他人提交</text><text x="288" y="47" text-anchor="middle" fill="#805B28" font-size="12">新版本可用</text>
      <line x1="368" y1="30" x2="416" y2="30" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="416" width="160" height="60" rx="6" fill="#DBEAFE"/><text x="496" y="26" text-anchor="middle" fill="#1D4ED8" font-size="14" font-weight="700">SELECT 2</text><text x="496" y="47" text-anchor="middle" fill="#42669B" font-size="12">新建 View B，可看见</text>
    </g>
    <text x="100" y="802" fill="#607086" font-size="14">每条快照读语句新建 ReadView，可能产生不可重复读。</text>

    <rect x="740" y="628" width="628" height="202" rx="8" fill="#172033"/>
    <text x="768" y="666" fill="#FFFFFF" font-size="20" font-weight="700">Repeatable Read</text>
    <g transform="translate(768 704)">
      <rect width="160" height="60" rx="6" fill="#E8F0FF"/><text x="80" y="26" text-anchor="middle" fill="#1D4ED8" font-size="14" font-weight="700">SELECT 1</text><text x="80" y="47" text-anchor="middle" fill="#42669B" font-size="12">创建 View A</text>
      <line x1="160" y1="30" x2="208" y2="30" stroke="#D7DFEA" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="208" width="160" height="60" rx="6" fill="#FFF4DD"/><text x="288" y="26" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700">他人提交</text><text x="288" y="47" text-anchor="middle" fill="#805B28" font-size="12">新版本产生</text>
      <line x1="368" y1="30" x2="416" y2="30" stroke="#D7DFEA" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="416" width="160" height="60" rx="6" fill="#E8F0FF"/><text x="496" y="26" text-anchor="middle" fill="#1D4ED8" font-size="14" font-weight="700">SELECT 2</text><text x="496" y="47" text-anchor="middle" fill="#42669B" font-size="12">复用 View A，不可见</text>
    </g>
    <text x="768" y="802" fill="#D7DFEA" font-size="14">同一事务复用首次一致性快照，保持可重复读。</text>
    <text x="720" y="870" text-anchor="middle" fill="#607086" font-size="15">当前读（FOR UPDATE / UPDATE / DELETE）读取最新可用版本并加锁，不沿用普通快照读语义。</text>
  </g>
</svg>
