<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">从输入 URL 到页面展示</title>
  <desc id="desc">展示浏览器解析 URL、DNS、TCP 或 QUIC、TLS、HTTP、资源加载以及渲染的完整链路，并展开 DNS 与 TLS 的关键职责。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#607086"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700">输入 URL 后，浏览器依次解决“去哪、怎么连、如何安全、拿什么”</text>
    <text x="72" y="101" fill="#607086" font-size="18">缓存命中、连接复用和 HTTP/3 会合并或跳过部分步骤，但依赖关系不变。</text>

    <rect x="72" y="146" width="1296" height="254" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <g transform="translate(96 206)">
      <rect width="150" height="104" rx="8" fill="#E8EEF5" stroke="#AAB6C5"/>
      <text x="75" y="38" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">① 解析 URL</text>
      <text x="75" y="68" text-anchor="middle" fill="#607086" font-size="14">协议 · 主机 · 端口</text>
      <text x="75" y="90" text-anchor="middle" fill="#607086" font-size="14">路径 · 查询参数</text>
      <line x1="150" y1="52" x2="192" y2="52" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="192" width="150" height="104" rx="8" fill="#DBEAFE" stroke="#93B4F5"/>
      <text x="267" y="38" text-anchor="middle" fill="#1D4ED8" font-size="18" font-weight="700">② DNS</text>
      <text x="267" y="68" text-anchor="middle" fill="#42669B" font-size="14">域名 → IP</text>
      <text x="267" y="90" text-anchor="middle" fill="#42669B" font-size="14">先逐级检查缓存</text>
      <line x1="342" y1="52" x2="384" y2="52" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="384" width="150" height="104" rx="8" fill="#CCFBF1" stroke="#7BC7B9"/>
      <text x="459" y="38" text-anchor="middle" fill="#0B5E57" font-size="18" font-weight="700">③ 建连</text>
      <text x="459" y="68" text-anchor="middle" fill="#356C67" font-size="14">TCP 三次握手</text>
      <text x="459" y="90" text-anchor="middle" fill="#356C67" font-size="14">或 QUIC</text>
      <line x1="534" y1="52" x2="576" y2="52" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="576" width="150" height="104" rx="8" fill="#FFF4DD" stroke="#E4B55B"/>
      <text x="651" y="38" text-anchor="middle" fill="#92400E" font-size="18" font-weight="700">④ TLS</text>
      <text x="651" y="68" text-anchor="middle" fill="#805B28" font-size="14">认证服务端</text>
      <text x="651" y="90" text-anchor="middle" fill="#805B28" font-size="14">协商会话密钥</text>
      <line x1="726" y1="52" x2="768" y2="52" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="768" width="150" height="104" rx="8" fill="#F1EAFE" stroke="#B69AE8"/>
      <text x="843" y="38" text-anchor="middle" fill="#5720A3" font-size="18" font-weight="700">⑤ HTTP</text>
      <text x="843" y="68" text-anchor="middle" fill="#6A4B93" font-size="14">请求 → 服务端</text>
      <text x="843" y="90" text-anchor="middle" fill="#6A4B93" font-size="14">响应 ← 服务端</text>
      <line x1="918" y1="52" x2="960" y2="52" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="960" width="150" height="104" rx="8" fill="#E8F0FF" stroke="#93B4F5"/>
      <text x="1035" y="38" text-anchor="middle" fill="#1D4ED8" font-size="18" font-weight="700">⑥ 加载资源</text>
      <text x="1035" y="68" text-anchor="middle" fill="#42669B" font-size="14">HTML · CSS · JS</text>
      <text x="1035" y="90" text-anchor="middle" fill="#42669B" font-size="14">图片 · 字体</text>
      <line x1="1110" y1="52" x2="1152" y2="52" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="1152" width="150" height="104" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/>
      <text x="1227" y="38" text-anchor="middle" fill="#0B5E57" font-size="18" font-weight="700">⑦ 渲染</text>
      <text x="1227" y="68" text-anchor="middle" fill="#356C67" font-size="14">DOM + CSSOM</text>
      <text x="1227" y="90" text-anchor="middle" fill="#356C67" font-size="14">布局 · 绘制 · 合成</text>
    </g>
    <rect x="96" y="340" width="1248" height="36" rx="5" fill="#E8EEF5"/>
    <text x="720" y="364" text-anchor="middle" fill="#425066" font-size="15">性能排查也按此拆分：DNS → 建连 → TLS → 服务端 → 下载 → 浏览器渲染</text>

    <rect x="72" y="438" width="628" height="380" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="478" fill="#172033" font-size="21" font-weight="700">DNS：递归解析器替客户端逐级问路</text>
    <g transform="translate(100 520)">
      <rect width="130" height="60" rx="6" fill="#E8EEF5" stroke="#AAB6C5"/><text x="65" y="37" text-anchor="middle" fill="#172033" font-size="15" font-weight="700">浏览器 / OS 缓存</text>
      <line x1="130" y1="30" x2="176" y2="30" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="176" width="150" height="60" rx="6" fill="#DBEAFE" stroke="#93B4F5"/><text x="251" y="27" text-anchor="middle" fill="#1D4ED8" font-size="15" font-weight="700">本地 DNS</text><text x="251" y="47" text-anchor="middle" fill="#42669B" font-size="12">递归查询入口</text>
      <line x1="326" y1="30" x2="372" y2="30" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="372" width="130" height="60" rx="6" fill="#FFF4DD" stroke="#E4B55B"/><text x="437" y="37" text-anchor="middle" fill="#92400E" font-size="15" font-weight="700">根 DNS</text>
      <line x1="437" y1="60" x2="437" y2="102" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="372" y="102" width="130" height="60" rx="6" fill="#F1EAFE" stroke="#B69AE8"/><text x="437" y="139" text-anchor="middle" fill="#5720A3" font-size="15" font-weight="700">顶级域 DNS</text>
      <line x1="372" y1="132" x2="326" y2="132" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="176" y="102" width="150" height="60" rx="6" fill="#CCFBF1" stroke="#7BC7B9"/><text x="251" y="128" text-anchor="middle" fill="#0B5E57" font-size="15" font-weight="700">权威 DNS</text><text x="251" y="149" text-anchor="middle" fill="#356C67" font-size="12">返回 A / AAAA</text>
      <path d="M176 132 H78 V190 H251 V162" fill="none" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <text x="65" y="215" fill="#607086" font-size="14">结果按 TTL 缓存；CNAME 还需继续解析目标名称。</text>
    </g>

    <rect x="740" y="438" width="628" height="380" rx="8" fill="#172033"/>
    <text x="768" y="478" fill="#FFFFFF" font-size="21" font-weight="700">TLS 1.3：身份认证 + 密钥协商 + 完整性</text>
    <g transform="translate(768 520)">
      <rect width="158" height="72" rx="6" fill="#E8F0FF"/>
      <text x="79" y="29" text-anchor="middle" fill="#1D4ED8" font-size="15" font-weight="700">ClientHello</text>
      <text x="79" y="51" text-anchor="middle" fill="#42669B" font-size="12">算法 + key share</text>
      <line x1="158" y1="36" x2="208" y2="36" stroke="#D7DFEA" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="208" width="208" height="72" rx="6" fill="#FFF4DD"/>
      <text x="312" y="27" text-anchor="middle" fill="#92400E" font-size="15" font-weight="700">ServerHello + 证书</text>
      <text x="312" y="49" text-anchor="middle" fill="#805B28" font-size="12">选择参数 · 签名握手</text>
      <line x1="416" y1="36" x2="466" y2="36" stroke="#D7DFEA" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="466" width="134" height="72" rx="6" fill="#CCFBF1"/>
      <text x="533" y="29" text-anchor="middle" fill="#0B5E57" font-size="15" font-weight="700">Finished</text>
      <text x="533" y="51" text-anchor="middle" fill="#356C67" font-size="12">验证握手完整性</text>
      <rect y="112" width="600" height="78" rx="6" fill="#273449"/>
      <text x="300" y="143" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">ECDHE 派生共享秘密 → 对称应用密钥</text>
      <text x="300" y="169" text-anchor="middle" fill="#D7DFEA" font-size="13">证书私钥用于身份签名，不直接加密 HTTP 业务数据</text>
      <text x="0" y="235" fill="#FDE68A" font-size="14">证书检查：可信 CA · 域名匹配 · 有效期 · 证书链与签名</text>
    </g>
  </g>
</svg>
