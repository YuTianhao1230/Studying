<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">TCP 三次握手时序图</title>
  <desc id="desc">客户端和服务端通过 SYN、SYN ACK、ACK 三个报文同步初始序列号并确认双向通信能力。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0F766E"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700">TCP 三次握手：同步序列号，确认双向可达</text>
    <text x="72" y="101" fill="#607086" font-size="18">箭头表示报文方向；状态写在对应端点一侧。</text>

    <rect x="92" y="132" width="450" height="66" rx="8" fill="#E8F0FF" stroke="#93B4F5"/>
    <rect x="898" y="132" width="450" height="66" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/>
    <text x="317" y="174" text-anchor="middle" fill="#153E85" font-size="23" font-weight="700">客户端 Client</text>
    <text x="1123" y="174" text-anchor="middle" fill="#0B5E57" font-size="23" font-weight="700">服务端 Server</text>

    <line x1="317" y1="198" x2="317" y2="742" stroke="#93B4F5" stroke-width="3" stroke-dasharray="8 8"/>
    <line x1="1123" y1="198" x2="1123" y2="742" stroke="#7BC7B9" stroke-width="3" stroke-dasharray="8 8"/>

    <rect x="110" y="220" width="176" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="198" y="248" text-anchor="middle" fill="#355986" font-size="17" font-weight="700">CLOSED</text>
    <rect x="1154" y="220" width="176" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="1242" y="248" text-anchor="middle" fill="#356C67" font-size="17" font-weight="700">LISTEN</text>

    <circle cx="317" cy="304" r="25" fill="#2563EB"/>
    <text x="317" y="312" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">1</text>
    <line x1="344" y1="304" x2="1090" y2="304" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <rect x="505" y="270" width="420" height="66" rx="8" fill="#FFFFFF" stroke="#93B4F5"/>
    <text x="715" y="298" text-anchor="middle" fill="#153E85" font-size="19" font-weight="700">SYN = 1，seq = x</text>
    <text x="715" y="322" text-anchor="middle" fill="#607086" font-size="15">客户端提出连接，并发送初始序列号 x</text>
    <rect x="110" y="334" width="176" height="42" rx="6" fill="#DBEAFE"/>
    <text x="198" y="362" text-anchor="middle" fill="#1D4ED8" font-size="17" font-weight="700">SYN_SENT</text>

    <rect x="1154" y="350" width="176" height="42" rx="6" fill="#CCFBF1"/>
    <text x="1242" y="378" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="700">SYN_RECV</text>
    <circle cx="1123" cy="430" r="25" fill="#0F766E"/>
    <text x="1123" y="438" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">2</text>
    <line x1="1096" y1="430" x2="350" y2="430" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow-teal)"/>
    <rect x="505" y="396" width="420" height="66" rx="8" fill="#FFFFFF" stroke="#7BC7B9"/>
    <text x="715" y="424" text-anchor="middle" fill="#0B5E57" font-size="19" font-weight="700">SYN = 1，ACK = 1</text>
    <text x="715" y="448" text-anchor="middle" fill="#607086" font-size="15">seq = y，ack = x + 1</text>

    <circle cx="317" cy="556" r="25" fill="#2563EB"/>
    <text x="317" y="564" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">3</text>
    <line x1="344" y1="556" x2="1090" y2="556" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <rect x="505" y="522" width="420" height="66" rx="8" fill="#FFFFFF" stroke="#93B4F5"/>
    <text x="715" y="550" text-anchor="middle" fill="#153E85" font-size="19" font-weight="700">ACK = 1</text>
    <text x="715" y="574" text-anchor="middle" fill="#607086" font-size="15">seq = x + 1，ack = y + 1</text>

    <rect x="110" y="608" width="176" height="42" rx="6" fill="#DBEAFE"/>
    <text x="198" y="636" text-anchor="middle" fill="#1D4ED8" font-size="17" font-weight="700">ESTABLISHED</text>
    <rect x="1154" y="608" width="176" height="42" rx="6" fill="#CCFBF1"/>
    <text x="1242" y="636" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="700">ESTABLISHED</text>

    <rect x="72" y="692" width="1296" height="144" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="726" fill="#172033" font-size="20" font-weight="700">每一步解决什么问题</text>
    <circle cx="113" cy="765" r="17" fill="#2563EB"/>
    <text x="113" y="771" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">1</text>
    <text x="142" y="771" fill="#355986" font-size="16">服务端确认：客户端能发、服务端能收</text>
    <circle cx="527" cy="765" r="17" fill="#0F766E"/>
    <text x="527" y="771" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">2</text>
    <text x="556" y="771" fill="#356C67" font-size="16">客户端确认：两个方向都可达</text>
    <circle cx="916" cy="765" r="17" fill="#B45309"/>
    <text x="916" y="771" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">3</text>
    <text x="945" y="771" fill="#805B28" font-size="16">服务端确认：客户端收到服务端序列号</text>
    <rect x="100" y="794" width="1240" height="25" rx="5" fill="#EEF2F6"/>
    <text x="720" y="812" text-anchor="middle" fill="#526277" font-size="15">第三次 ACK 防止服务端把延迟到达的旧 SYN 误当成仍有效的新连接</text>
  </g>
</svg>
