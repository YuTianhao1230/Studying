<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="880" viewBox="0 0 1440 880" role="img" aria-labelledby="title desc">
  <title id="title">RoPE 旋转位置编码的几何直觉</title>
  <desc id="desc">Query 和 Key 按各自绝对位置旋转，二者做内积时只留下位置差，因此注意力分数包含相对位置信息。</desc>
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#607086"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#BE123C"/>
    </marker>
  </defs>
  <rect width="1440" height="880" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700">RoPE：绝对位置负责旋转，相对距离决定内积</text>
    <text x="72" y="101" fill="#607086" font-size="18">每两个特征维组成一个二维平面，不同维度组使用不同旋转频率。</text>

    <rect x="72" y="142" width="602" height="430" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="181" fill="#172033" font-size="21" font-weight="700">位置 m：旋转 Query</text>
    <g transform="translate(355 372)">
      <line x1="-190" y1="0" x2="205" y2="0" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow-gray)"/>
      <line x1="0" y1="150" x2="0" y2="-170" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow-gray)"/>
      <line x1="0" y1="0" x2="142" y2="-48" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow-gray)"/>
      <line x1="0" y1="0" x2="78" y2="-128" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow-blue)"/>
      <path d="M82 -28 A88 88 0 0 0 48 -72" fill="none" stroke="#2563EB" stroke-width="3"/>
      <text x="112" y="-55" fill="#607086" font-size="16">原始 q</text>
      <text x="58" y="-142" fill="#1D4ED8" font-size="17" font-weight="700">R_m q</text>
      <text x="88" y="-91" fill="#1D4ED8" font-size="16">mθ</text>
      <text x="214" y="22" fill="#94A3B8" font-size="14">dim 1</text>
      <text x="12" y="-174" fill="#94A3B8" font-size="14">dim 2</text>
    </g>

    <rect x="766" y="142" width="602" height="430" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="794" y="181" fill="#172033" font-size="21" font-weight="700">位置 n：旋转 Key</text>
    <g transform="translate(1049 372)">
      <line x1="-190" y1="0" x2="205" y2="0" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow-gray)"/>
      <line x1="0" y1="150" x2="0" y2="-170" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow-gray)"/>
      <line x1="0" y1="0" x2="128" y2="-78" stroke="#94A3B8" stroke-width="4" marker-end="url(#arrow-gray)"/>
      <line x1="0" y1="0" x2="-18" y2="-149" stroke="#BE123C" stroke-width="5" marker-end="url(#arrow-rose)"/>
      <path d="M74 -45 A88 88 0 0 0 -8 -88" fill="none" stroke="#BE123C" stroke-width="3"/>
      <text x="108" y="-92" fill="#607086" font-size="16">原始 k</text>
      <text x="-92" y="-151" fill="#BE123C" font-size="17" font-weight="700">R_n k</text>
      <text x="24" y="-98" fill="#BE123C" font-size="16">nθ</text>
      <text x="214" y="22" fill="#94A3B8" font-size="14">dim 1</text>
      <text x="12" y="-174" fill="#94A3B8" font-size="14">dim 2</text>
    </g>

    <rect x="72" y="610" width="1296" height="210" rx="8" fill="#172033"/>
    <text x="720" y="653" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">旋转后的内积只依赖角度差</text>
    <text x="720" y="699" text-anchor="middle" fill="#C4B5FD" font-size="22">(R_m q) · (R_n k) = qᵀ R_(n-m) k</text>
    <line x1="320" y1="732" x2="1120" y2="732" stroke="#526277" stroke-width="2"/>
    <text x="326" y="770" fill="#93B4F5" font-size="17" font-weight="700">输入端</text>
    <text x="420" y="770" fill="#D7DFEA" font-size="16">Q、K 分别注入绝对位置 m、n</text>
    <text x="813" y="770" fill="#7BC7B9" font-size="17" font-weight="700">Attention 端</text>
    <text x="954" y="770" fill="#D7DFEA" font-size="16">只留下相对距离 n − m</text>
    <text x="720" y="803" text-anchor="middle" fill="#FFFFFF" font-size="15">旋转保持向量范数不变；长上下文仍需配合 RoPE scaling，并非天然无限外推</text>
  </g>
</svg>
