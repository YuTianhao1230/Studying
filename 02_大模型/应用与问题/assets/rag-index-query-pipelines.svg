<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">RAG 离线索引与在线问答</title>
  <desc id="desc">RAG 包含离线索引和在线问答两条链路，并通过引用与拒答形成证据约束。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">RAG 的两条链路：离线把知识变成可检索证据，在线把问题变成带引用答案</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">索引质量决定能否找到，查询链路决定能否选对、放对并忠实使用。</text><text x="72" y="154" fill="#2563EB" font-size="22" font-weight="700" text-anchor="start">离线索引</text><rect x="72" y="180" width="184" height="86" rx="8" fill="#E8F0FF" stroke="#93B4F5"/><text x="164.0" y="230.0" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">文档接入</text><line x1="256" y1="223" x2="280" y2="223" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="288" y="180" width="184" height="86" rx="8" fill="#E8F0FF" stroke="#93B4F5"/><text x="380.0" y="230.0" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">解析清洗</text><line x1="472" y1="223" x2="496" y2="223" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="504" y="180" width="184" height="86" rx="8" fill="#E8F0FF" stroke="#93B4F5"/><text x="596.0" y="230.0" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">语义切块</text><line x1="688" y1="223" x2="712" y2="223" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="720" y="180" width="184" height="86" rx="8" fill="#F1EAFE" stroke="#93B4F5"/><text x="812.0" y="230.0" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">元数据 / ACL</text><line x1="904" y1="223" x2="928" y2="223" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="936" y="180" width="184" height="86" rx="8" fill="#F1EAFE" stroke="#93B4F5"/><text x="1028.0" y="230.0" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">Embedding</text><line x1="1120" y1="223" x2="1144" y2="223" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="1152" y="180" width="184" height="86" rx="8" fill="#F1EAFE" stroke="#93B4F5"/><text x="1244.0" y="230.0" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">版本化索引</text><rect x="72" y="300" width="1296" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="100" y="337" fill="#172033" font-size="17" font-weight="700" text-anchor="start">每个 chunk 必须保留</text><text x="290" y="337" fill="#607086" font-size="16" font-weight="400" text-anchor="start">来源 · 标题层级 · 页码 · 时间 · 权限 · 业务标签 · 索引版本</text><text x="100" y="367" fill="#B91C1C" font-size="15" font-weight="700" text-anchor="start">错误切块、缺元数据、旧索引或 ACL 漏标，在线再强也无法补回。</text><text x="72" y="458" fill="#0F766E" font-size="22" font-weight="700" text-anchor="start">在线问答</text><rect x="72" y="484" width="184" height="98" rx="8" fill="#E7F8F4" stroke="#0F766E"/><text x="164.0" y="540.0" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">用户问题</text><line x1="256" y1="533" x2="280" y2="533" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="288" y="484" width="184" height="98" rx="8" fill="#E7F8F4" stroke="#0F766E"/><text x="380.0" y="540.0" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">鉴权 / 改写</text><line x1="472" y1="533" x2="496" y2="533" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="504" y="484" width="184" height="98" rx="8" fill="#E7F8F4" stroke="#0F766E"/><text x="596.0" y="540.0" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">混合召回</text><line x1="688" y1="533" x2="712" y2="533" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="720" y="484" width="184" height="98" rx="8" fill="#FFF4DD" stroke="#B45309"/><text x="812.0" y="540.0" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">Rerank</text><line x1="904" y1="533" x2="928" y2="533" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="936" y="484" width="184" height="98" rx="8" fill="#FFF4DD" stroke="#B45309"/><text x="1028.0" y="520" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">Context Packing</text><text x="1028.0" y="550" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1028.0" dy="0">只传递必要证据</tspan></text><line x1="1120" y1="533" x2="1144" y2="533" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="1152" y="484" width="184" height="98" rx="8" fill="#ECFDF3" stroke="#15803D"/><text x="1244.0" y="540.0" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">生成 + 引用校验</text><rect x="72" y="640" width="1296" height="164" rx="8" fill="#172033"/><text x="100" y="682" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="start">闭环门禁</text><text x="100" y="724" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="start">召回</text><text x="100" y="752" fill="#D7DFEA" font-size="14" font-weight="400" text-anchor="start"><tspan x="100" dy="0">正确证据进入候选</tspan></text><text x="346" y="724" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="start">排序</text><text x="346" y="752" fill="#D7DFEA" font-size="14" font-weight="400" text-anchor="start"><tspan x="346" dy="0">真正支持问题的证据靠前</tspan></text><text x="592" y="724" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="start">上下文</text><text x="592" y="752" fill="#D7DFEA" font-size="14" font-weight="400" text-anchor="start"><tspan x="592" dy="0">限定条件与出处不丢失</tspan></text><text x="838" y="724" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="start">生成</text><text x="838" y="752" fill="#D7DFEA" font-size="14" font-weight="400" text-anchor="start"><tspan x="838" dy="0">关键结论绑定 evidence_id</tspan></text><text x="1084" y="724" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="start">空证据</text><text x="1084" y="752" fill="#D7DFEA" font-size="14" font-weight="400" text-anchor="start"><tspan x="1084" dy="0">允许拒答，而不是编造</tspan></text><text x="720" y="858" fill="#607086" font-size="16" font-weight="400" text-anchor="middle">知识变更只需重建并发布索引；答案复现依赖输入、权限、索引与模型版本共同冻结。</text>
  </g>
</svg>
