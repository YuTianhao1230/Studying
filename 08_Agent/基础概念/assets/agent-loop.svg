<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent Loop</title>
  <desc id="desc">Agent 围绕目标观察、规划、行动、反思和验证，并受硬边界控制。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">Agent Loop：行动改变环境，反馈改变下一步</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">真正的 Agent 不是一次生成，而是有边界、有反馈、有终止条件的执行闭环。</text><rect x="555" y="350" width="330" height="120" rx="8" fill="#F1EAFE" stroke="#B69AE8"/><text x="720.0" y="386" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">目标与当前状态</text><text x="720.0" y="416" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="720.0" dy="0">未解决目标</tspan><tspan x="720.0" dy="22">已知事实 / 约束 / 预算</tspan></text><rect x="110" y="180" width="280" height="92" rx="8" fill="#E8F0FF" stroke="#93B4F5"/><text x="250.0" y="216" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">1 观察 Observe</text><text x="250.0" y="246" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="250.0" dy="0">读取环境与已有证据</tspan></text><rect x="475" y="150" width="280" height="92" rx="8" fill="#FFF4DD" stroke="#E4B55B"/><text x="615.0" y="186" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">2 规划 Plan</text><text x="615.0" y="216" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="615.0" dy="0">选择最小可验证下一步</tspan></text><rect x="850" y="180" width="280" height="92" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/><text x="990.0" y="216" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">3 行动 Act</text><text x="990.0" y="246" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="990.0" dy="0">调用工具或执行动作</tspan></text><rect x="1050" y="370" width="280" height="92" rx="8" fill="#E8F0FF" stroke="#93B4F5"/><text x="1190.0" y="406" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">4 新观察</text><text x="1190.0" y="436" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1190.0" dy="0">结构化接收工具结果</tspan></text><rect x="805" y="570" width="280" height="92" rx="8" fill="#FFF4DD" stroke="#E4B55B"/><text x="945.0" y="606" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">5 反思 Reflect</text><text x="945.0" y="636" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="945.0" dy="0">更新假设与失败原因</tspan></text><rect x="380" y="600" width="280" height="92" rx="8" fill="#ECFDF3" stroke="#86D3A0"/><text x="520.0" y="636" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">6 验证 Verify</text><text x="520.0" y="666" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="520.0" dy="0">完成 / 降级 / 求助 / 继续</tspan></text><path d="M390 220 C420 190 445 185 468 186" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M755 186 C790 185 815 190 844 220" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M1130 272 C1170 300 1185 325 1185 362" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M1050 462 C995 525 950 555 921 570" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M805 646 C750 675 705 675 666 650" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow-orange)"/><path d="M380 632 C250 610 205 525 215 282" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><line x1="720" y1="350" x2="720" y2="282" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><line x1="885" y1="410" x2="1042" y2="410" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><line x1="720" y1="470" x2="720" y2="594" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="72" y="742" width="1296" height="102" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="100" y="778" fill="#172033" font-size="19" font-weight="700" text-anchor="start">硬边界</text><rect x="220" y="758" width="170" height="34" rx="6" fill="#E8F0FF"/><text x="305.0" y="781" fill="#2563EB" font-size="14" font-weight="700" text-anchor="middle">最大步数</text><rect x="390" y="758" width="170" height="34" rx="6" fill="#FFF4DD"/><text x="475.0" y="781" fill="#B45309" font-size="14" font-weight="700" text-anchor="middle">超时与预算</text><rect x="590" y="758" width="170" height="34" rx="6" fill="#F1EAFE"/><text x="675.0" y="781" fill="#6D28D9" font-size="14" font-weight="700" text-anchor="middle">重复动作检测</text><rect x="810" y="758" width="170" height="34" rx="6" fill="#FEE2E2"/><text x="895.0" y="781" fill="#B91C1C" font-size="14" font-weight="700" text-anchor="middle">权限与确认</text><rect x="1000" y="758" width="210" height="34" rx="6" fill="#ECFDF3"/><text x="1105.0" y="781" fill="#15803D" font-size="14" font-weight="700" text-anchor="middle">结构化完成条件</text><text x="720" y="828" fill="#607086" font-size="15" font-weight="400" text-anchor="middle">没有这些边界，循环会退化为目标漂移、重复调用或无限执行。</text>
  </g>
</svg>
