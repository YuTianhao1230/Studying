<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Context Engineering 漏斗</title>
  <desc id="desc">候选信息通过相关性、可靠性、新鲜度、精简和可行动性筛选后进入上下文。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">Context Engineering：不是塞得更多，而是让当前一步看对信息</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">来源先分层，再按相关性、可靠性、新鲜度和预算逐步筛选。</text><text x="82" y="152" fill="#172033" font-size="21" font-weight="700" text-anchor="start">候选信息源</text><rect x="72" y="178" width="290" height="58" rx="8" fill="#E8F0FF" stroke="#2563EB"/><text x="217.0" y="214.0" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">系统与用户约束</text><rect x="72" y="256" width="290" height="58" rx="8" fill="#F1EAFE" stroke="#6D28D9"/><text x="217.0" y="292.0" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">当前状态与计划</text><rect x="72" y="334" width="290" height="58" rx="8" fill="#E7F8F4" stroke="#0F766E"/><text x="217.0" y="370.0" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">代码 / 文档 / Skill</text><rect x="72" y="412" width="290" height="58" rx="8" fill="#FFF4DD" stroke="#B45309"/><text x="217.0" y="448.0" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">工具结果与证据</text><rect x="72" y="490" width="290" height="58" rx="8" fill="#ECFDF3" stroke="#15803D"/><text x="217.0" y="526.0" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">长期 Memory</text><rect x="72" y="568" width="290" height="58" rx="8" fill="#FEE2E2" stroke="#B91C1C"/><text x="217.0" y="604.0" fill="#B91C1C" font-size="19" font-weight="700" text-anchor="middle">历史轨迹与错误</text><path d="M380 410 C455 410 475 410 525 410" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><polygon points="520,188 900,188 820,632 600,632" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><rect x="550.0" y="234" width="320" height="44" rx="6" fill="#E8F0FF" stroke="#CBD5E1"/><text x="710" y="263" fill="#2563EB" font-size="15" font-weight="700" text-anchor="middle">1 相关：服务当前决策</text><rect x="561.0" y="316" width="298" height="44" rx="6" fill="#E8F0FF" stroke="#CBD5E1"/><text x="710" y="345" fill="#2563EB" font-size="15" font-weight="700" text-anchor="middle">2 可靠：有来源，可验证</text><rect x="572.5" y="398" width="275" height="44" rx="6" fill="#E8F0FF" stroke="#CBD5E1"/><text x="710" y="427" fill="#2563EB" font-size="15" font-weight="700" text-anchor="middle">3 新鲜：版本和时间有效</text><rect x="584.0" y="480" width="252" height="44" rx="6" fill="#E7F8F4" stroke="#CBD5E1"/><text x="710" y="509" fill="#0F766E" font-size="15" font-weight="700" text-anchor="middle">4 精简：去重、压缩、分层</text><rect x="595.5" y="562" width="229" height="44" rx="6" fill="#E7F8F4" stroke="#CBD5E1"/><text x="710" y="591" fill="#0F766E" font-size="15" font-weight="700" text-anchor="middle">5 可行动：能指导下一步</text><line x1="900" y1="410" x2="980" y2="410" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="990" y="240" width="378" height="336" rx="8" fill="#172033" stroke="#172033"/><text x="1179.0" y="276" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">当前 Context Window</text><text x="1179.0" y="306" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1179.0" dy="0">必须约束</tspan><tspan x="1179.0" dy="22">当前目标与状态</tspan><tspan x="1179.0" dy="22">最少充分证据</tspan><tspan x="1179.0" dy="22">最近工具结果摘要</tspan><tspan x="1179.0" dy="22">输出契约</tspan></text><rect x="1042" y="500" width="274" height="34" rx="6" fill="#27364A"/><text x="1179.0" y="523" fill="#D7DFEA" font-size="14" font-weight="700" text-anchor="middle">只保留这一步需要的信息</text><rect x="72" y="690" width="1296" height="154" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="100" y="730" fill="#172033" font-size="20" font-weight="700" text-anchor="start">渐进加载与 Memory 分工</text><rect x="100" y="756" width="210" height="58" rx="8" fill="#E8F0FF" stroke="#93B4F5"/><text x="205.0" y="792.0" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">目录 / 摘要</text><line x1="310" y1="785" x2="354" y2="785" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="362" y="756" width="210" height="58" rx="8" fill="#F1EAFE" stroke="#B69AE8"/><text x="467.0" y="792.0" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">相关章节</text><line x1="572" y1="785" x2="616" y2="785" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="624" y="756" width="210" height="58" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/><text x="729.0" y="792.0" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">具体片段</text><line x1="834" y1="785" x2="878" y2="785" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="886" y="756" width="210" height="58" rx="8" fill="#FFF4DD" stroke="#E4B55B"/><text x="991.0" y="792.0" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">必要时全文</text><rect x="1140" y="768" width="186" height="34" rx="6" fill="#ECFDF3"/><text x="1233.0" y="791" fill="#15803D" font-size="14" font-weight="700" text-anchor="middle">Memory 按需检索</text>
  </g>
</svg>
