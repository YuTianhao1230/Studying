<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Agentic RAG 证据闭环</title>
  <desc id="desc">Agentic RAG 根据证据缺口动态检索、验证、继续或停止。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">Agentic RAG：围绕证据缺口迭代，而不是无方向地多搜几轮</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">每轮都要说明缺什么证据、去哪里取、何时停止，以及结论由哪条证据支持。</text><rect x="80" y="214" width="220" height="112" rx="8" fill="#E8F0FF" stroke="#2563EB"/><text x="190.0" y="250" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">拆解问题</text><text x="190.0" y="280" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="190.0" dy="0">实体 / 时间 / 版本</tspan></text><rect x="330" y="214" width="220" height="112" rx="8" fill="#F1EAFE" stroke="#6D28D9"/><text x="440.0" y="250" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">路由数据源</text><text x="440.0" y="280" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="440.0" dy="0">搜索 / DB / API / 代码</tspan></text><rect x="580" y="214" width="220" height="112" rx="8" fill="#E7F8F4" stroke="#0F766E"/><text x="690.0" y="250" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">检索与工具</text><text x="690.0" y="280" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="690.0" dy="0">ACL 预过滤 + 多路召回</tspan></text><rect x="830" y="214" width="220" height="112" rx="8" fill="#FFF4DD" stroke="#B45309"/><text x="940.0" y="250" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">重排与压缩</text><text x="940.0" y="280" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="940.0" dy="0">去重 / 时效 / rerank</tspan></text><rect x="1080" y="214" width="220" height="112" rx="8" fill="#ECFDF3" stroke="#15803D"/><text x="1190.0" y="250" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">证据验证</text><text x="1190.0" y="280" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1190.0" dy="0">覆盖 / 冲突 / 引用</tspan></text><line x1="300" y1="270" x2="322" y2="270" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><line x1="550" y1="270" x2="572" y2="270" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><line x1="800" y1="270" x2="822" y2="270" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><line x1="1050" y1="270" x2="1072" y2="270" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="488" y="440" width="464" height="150" rx="8" fill="#FFFFFF" stroke="#B69AE8"/><text x="720.0" y="476" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">证据是否充分？</text><text x="720.0" y="506" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="720.0" dy="0">关键子问题均覆盖</tspan><tspan x="720.0" dy="22">版本、权限、范围一致</tspan><tspan x="720.0" dy="22">结论可绑定 evidence_id</tspan></text><path d="M1190 326 C1190 395 952 390 952 470" fill="none" stroke="#15803D" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M488 500 C370 500 310 390 330 334" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow-orange)"/><rect x="184" y="468" width="248" height="34" rx="6" fill="#FFF4DD"/><text x="308.0" y="491" fill="#B45309" font-size="14" font-weight="700" text-anchor="middle">不充分：改写查询 / 补数据源</text><path d="M720 590 C720 645 430 650 430 698" fill="none" stroke="#15803D" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M720 590 C720 645 1010 650 1010 698" fill="none" stroke="#B91C1C" stroke-width="3" marker-end="url(#arrow-red)"/><rect x="250" y="706" width="360" height="92" rx="8" fill="#ECFDF3" stroke="#86D3A0"/><text x="430.0" y="742" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">生成带引用结论</text><text x="430.0" y="772" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="430.0" dy="0">事实、推断、假设分开</tspan></text><rect x="830" y="706" width="360" height="92" rx="8" fill="#FEE2E2" stroke="#F2A7A7"/><text x="1010.0" y="742" fill="#B91C1C" font-size="19" font-weight="700" text-anchor="middle">降级 / 拒答 / 人工复核</text><text x="1010.0" y="772" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1010.0" dy="0">无证据、权限不足或冲突不可解</tspan></text><text x="720" y="855" fill="#607086" font-size="16" font-weight="400" text-anchor="middle">硬停止：最大轮数 / 工具调用 / token / 总耗时；连续两轮无新增有效证据则提前结束。</text>
  </g>
</svg>
