<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Tool 与 MCP 六层链路</title>
  <desc id="desc">Agent、Tool Schema、MCP Client、MCP Server、适配器和真实后端组成完整链路，治理层横切各层。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">Tool 与 MCP 六层链路：协议接入不等于安全边界</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">每层只承担自己的职责；身份、资源权限和副作用控制必须贯穿全链路。</text><rect x="72" y="190" width="196" height="174" rx="8" fill="#E8F0FF" stroke="#2563EB"/><text x="170.0" y="226" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">1 Agent</text><text x="170.0" y="256" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="170.0" dy="0">决定是否调用</tspan><tspan x="170.0" dy="22">维护任务状态</tspan></text><rect x="292" y="190" width="196" height="174" rx="8" fill="#F1EAFE" stroke="#6D28D9"/><text x="390.0" y="226" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">2 Tool Schema</text><text x="390.0" y="256" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="390.0" dy="0">描述参数与返回</tspan><tspan x="390.0" dy="22">声明副作用</tspan></text><rect x="512" y="190" width="196" height="174" rx="8" fill="#E7F8F4" stroke="#0F766E"/><text x="610.0" y="226" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">3 MCP Client</text><text x="610.0" y="256" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="610.0" dy="0">发现能力 / 建连</tspan><tspan x="610.0" dy="22">发送请求</tspan></text><rect x="732" y="190" width="196" height="174" rx="8" fill="#FFF4DD" stroke="#B45309"/><text x="830.0" y="226" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">4 MCP Server</text><text x="830.0" y="256" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="830.0" dy="0">封装工具与资源</tspan><tspan x="830.0" dy="22">服务端校验</tspan></text><rect x="952" y="190" width="196" height="174" rx="8" fill="#ECFDF3" stroke="#15803D"/><text x="1050.0" y="226" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">5 业务适配器</text><text x="1050.0" y="256" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1050.0" dy="0">字段转换 / 幂等</tspan><tspan x="1050.0" dy="22">错误映射</tspan></text><rect x="1172" y="190" width="196" height="174" rx="8" fill="#FEE2E2" stroke="#B91C1C"/><text x="1270.0" y="226" fill="#B91C1C" font-size="19" font-weight="700" text-anchor="middle">6 真实后端</text><text x="1270.0" y="256" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1270.0" dy="0">API / DB / 设备</tspan><tspan x="1270.0" dy="22">最终资源鉴权</tspan></text><line x1="268" y1="277" x2="286" y2="277" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><line x1="488" y1="277" x2="506" y2="277" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><line x1="708" y1="277" x2="726" y2="277" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><line x1="928" y1="277" x2="946" y2="277" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><line x1="1148" y1="277" x2="1166" y2="277" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M1270 364 C1270 440 170 440 170 372" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="510" y="416" width="420" height="34" rx="6" fill="#E7F8F4"/><text x="720.0" y="439" fill="#0F766E" font-size="14" font-weight="700" text-anchor="middle">结构化结果 → 状态更新 → 下一轮决策</text><rect x="72" y="500" width="1296" height="258" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="100" y="540" fill="#172033" font-size="21" font-weight="700" text-anchor="start">横切治理层</text><rect x="100" y="574" width="224" height="128" rx="8" fill="#E8F0FF" stroke="#2563EB"/><text x="212.0" y="610" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">身份</text><text x="212.0" y="640" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="212.0" dy="0">谁发起 / 谁执行</tspan><tspan x="212.0" dy="22">谁拥有数据</tspan></text><rect x="348" y="574" width="224" height="128" rx="8" fill="#F1EAFE" stroke="#6D28D9"/><text x="460.0" y="610" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">授权</text><text x="460.0" y="640" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="460.0" dy="0">最小 scope + 资源范围</tspan><tspan x="460.0" dy="22">Server 二次鉴权</tspan></text><rect x="596" y="574" width="224" height="128" rx="8" fill="#E7F8F4" stroke="#0F766E"/><text x="708.0" y="610" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">凭证</text><text x="708.0" y="640" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="708.0" dy="0">短期 token</tspan><tspan x="708.0" dy="22">不进入 Prompt 与日志</tspan></text><rect x="844" y="574" width="224" height="128" rx="8" fill="#FFF4DD" stroke="#B45309"/><text x="956.0" y="610" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">副作用</text><text x="956.0" y="640" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="956.0" dy="0">dry-run / 人工确认</tspan><tspan x="956.0" dy="22">幂等 / 回滚</tspan></text><rect x="1092" y="574" width="224" height="128" rx="8" fill="#ECFDF3" stroke="#15803D"/><text x="1204.0" y="610" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">审计</text><text x="1204.0" y="640" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1204.0" dy="0">request_id / 版本</tspan><tspan x="1204.0" dy="22">结果 / 操作主体</tspan></text><rect x="72" y="790" width="1296" height="54" rx="8" fill="#172033"/><text x="720" y="824" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="middle">Client 已鉴权 ≠ Server 和真实后端可以省略资源级鉴权</text>
  </g>
</svg>
