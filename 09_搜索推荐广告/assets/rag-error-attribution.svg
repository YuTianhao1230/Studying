<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">RAG 错答归因漏斗</title>
  <desc id="desc">通过入库、召回、粗排、精排、重排和生成逐层定位正确证据首次丢失的位置。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">RAG 错答归因：沿漏斗寻找第一处丢失正确证据的位置</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">后层只能处理上游留下的候选；先定位阶段，再修改索引、召回、排序、上下文或生成。</text><rect x="72" y="190" width="184" height="210" rx="8" fill="#E8F0FF" stroke="#2563EB"/><text x="164" y="226" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">1 入库</text><text x="164" y="268" fill="#607086" font-size="13" font-weight="400" text-anchor="middle"><tspan x="164" dy="0">资料存在且可解析？</tspan><tspan x="164" dy="23">版本是否有效？</tspan></text><text x="164" y="350" fill="#607086" font-size="14" font-weight="700" text-anchor="middle">解析 / 切块 / 索引</text><line x1="256" y1="295" x2="280" y2="295" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="288" y="190" width="184" height="210" rx="8" fill="#F1EAFE" stroke="#6D28D9"/><text x="380" y="226" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">2 召回</text><text x="380" y="268" fill="#607086" font-size="13" font-weight="400" text-anchor="middle"><tspan x="380" dy="0">正确证据是否</tspan><tspan x="380" dy="23">进入候选集？</tspan></text><text x="380" y="350" fill="#607086" font-size="14" font-weight="700" text-anchor="middle">Recall@K / ACL</text><line x1="472" y1="295" x2="496" y2="295" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="504" y="190" width="184" height="210" rx="8" fill="#E7F8F4" stroke="#0F766E"/><text x="596" y="226" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">3 粗排</text><text x="596" y="268" fill="#607086" font-size="13" font-weight="400" text-anchor="middle"><tspan x="596" dy="0">是否把关键候选</tspan><tspan x="596" dy="23">提前误杀？</tspan></text><text x="596" y="350" fill="#607086" font-size="14" font-weight="700" text-anchor="middle">正例保留率</text><line x1="688" y1="295" x2="712" y2="295" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="720" y="190" width="184" height="210" rx="8" fill="#FFF4DD" stroke="#B45309"/><text x="812" y="226" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">4 精排</text><text x="812" y="268" fill="#607086" font-size="13" font-weight="400" text-anchor="middle"><tspan x="812" dy="0">是否排进</tspan><tspan x="812" dy="23">最终 Top-K？</tspan></text><text x="812" y="350" fill="#607086" font-size="14" font-weight="700" text-anchor="middle">MRR / NDCG</text><line x1="904" y1="295" x2="928" y2="295" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="936" y="190" width="184" height="210" rx="8" fill="#ECFDF3" stroke="#15803D"/><text x="1028" y="226" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">5 重排</text><text x="1028" y="268" fill="#607086" font-size="13" font-weight="400" text-anchor="middle"><tspan x="1028" dy="0">是否因去重、冲突</tspan><tspan x="1028" dy="23">或预算被移除？</tspan></text><text x="1028" y="350" fill="#607086" font-size="14" font-weight="700" text-anchor="middle">token / 规则命中</text><line x1="1120" y1="295" x2="1144" y2="295" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="1152" y="190" width="184" height="210" rx="8" fill="#FEE2E2" stroke="#B91C1C"/><text x="1244" y="226" fill="#B91C1C" font-size="19" font-weight="700" text-anchor="middle">6 生成</text><text x="1244" y="268" fill="#607086" font-size="13" font-weight="400" text-anchor="middle"><tspan x="1244" dy="0">是否忠实使用</tspan><tspan x="1244" dy="23">并正确引用？</tspan></text><text x="1244" y="350" fill="#607086" font-size="14" font-weight="700" text-anchor="middle">faithfulness</text><rect x="72" y="462" width="1296" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="100" y="502" fill="#172033" font-size="21" font-weight="700" text-anchor="start">诊断原则</text><rect x="100" y="538" width="254" height="34" rx="6" fill="#E8F0FF"/><text x="227.0" y="561" fill="#2563EB" font-size="14" font-weight="700" text-anchor="middle">正确证据未入库</text><text x="382" y="561" fill="#607086" font-size="15" font-weight="400" text-anchor="start">修解析、切块、版本与索引发布；换更强生成模型无效</text><rect x="100" y="580" width="254" height="34" rx="6" fill="#F1EAFE"/><text x="227.0" y="603" fill="#6D28D9" font-size="14" font-weight="700" text-anchor="middle">已召回但未进 Top-K</text><text x="382" y="603" fill="#607086" font-size="15" font-weight="400" text-anchor="start">修粗排保留率、训练样本或 reranker</text><rect x="100" y="622" width="254" height="34" rx="6" fill="#FFF4DD"/><text x="227.0" y="645" fill="#B45309" font-size="14" font-weight="700" text-anchor="middle">Top-K 中有证据但 prompt 没有</text><text x="382" y="645" fill="#607086" font-size="15" font-weight="400" text-anchor="start">修去重、压缩、token budget 与冲突规则</text><rect x="100" y="664" width="254" height="34" rx="6" fill="#FEE2E2"/><text x="227.0" y="687" fill="#B91C1C" font-size="14" font-weight="700" text-anchor="middle">Prompt 中有证据但答案错误</text><text x="382" y="687" fill="#607086" font-size="15" font-weight="400" text-anchor="start">修引用约束、生成模型或拒答门禁</text><rect x="72" y="758" width="1296" height="86" rx="8" fill="#172033"/><text x="720" y="793" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="middle">一次只改一个阶段，用固定 case 重放并比较阶段指标</text><text x="720" y="822" fill="#D7DFEA" font-size="15" font-weight="400" text-anchor="middle">否则端到端分数变化无法说明问题究竟被修在何处。</text>
  </g>
</svg>
