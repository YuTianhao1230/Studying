<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">搜索与推荐对比</title>
  <desc id="desc">搜索和推荐共用分层排序骨架，但在意图、库存、反馈和延迟方面不同。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">搜索 vs 推荐：共用排序骨架，但意图、库存与反馈语义不同</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">搜索从显式 Query 出发；推荐从历史与会话推断当前兴趣。</text><rect x="72" y="150" width="590" height="540" rx="8" fill="#FFFFFF" stroke="#93B4F5"/><rect x="778" y="150" width="590" height="540" rx="8" fill="#FFFFFF" stroke="#7BC7B9"/><text x="367" y="194" fill="#2563EB" font-size="24" font-weight="700" text-anchor="middle">搜索 Search</text><text x="1073" y="194" fill="#0F766E" font-size="24" font-weight="700" text-anchor="middle">推荐 Recommendation</text><rect x="100" y="226" width="112" height="34" rx="6" fill="#E8F0FF"/><text x="156.0" y="249" fill="#2563EB" font-size="14" font-weight="700" text-anchor="middle">意图入口</text><text x="232" y="242" fill="#607086" font-size="14" font-weight="400" text-anchor="start"><tspan x="232" dy="0">用户显式 Query：短、歧义、含硬约束</tspan></text><rect x="100" y="314" width="112" height="34" rx="6" fill="#E8F0FF"/><text x="156.0" y="337" fill="#2563EB" font-size="14" font-weight="700" text-anchor="middle">库存重点</text><text x="232" y="330" fill="#607086" font-size="14" font-weight="400" text-anchor="start"><tspan x="232" dy="0">抓取、解析、索引覆盖与时效</tspan></text><rect x="100" y="402" width="112" height="34" rx="6" fill="#E8F0FF"/><text x="156.0" y="425" fill="#2563EB" font-size="14" font-weight="700" text-anchor="middle">核心难点</text><text x="232" y="418" fill="#607086" font-size="14" font-weight="400" text-anchor="start"><tspan x="232" dy="0">纠错、实体、专名、零结果与长尾</tspan></text><rect x="100" y="490" width="112" height="34" rx="6" fill="#E8F0FF"/><text x="156.0" y="513" fill="#2563EB" font-size="14" font-weight="700" text-anchor="middle">反馈偏差</text><text x="232" y="506" fill="#607086" font-size="14" font-weight="400" text-anchor="start"><tspan x="232" dy="0">位置与摘要影响点击；看满意点击/改写</tspan></text><rect x="100" y="578" width="112" height="34" rx="6" fill="#E8F0FF"/><text x="156.0" y="601" fill="#2563EB" font-size="14" font-weight="700" text-anchor="middle">延迟</text><text x="232" y="594" fill="#607086" font-size="14" font-weight="400" text-anchor="start"><tspan x="232" dy="0">每次 Query 在线检索，强交互尾延迟</tspan></text><rect x="806" y="226" width="112" height="34" rx="6" fill="#E7F8F4"/><text x="862.0" y="249" fill="#0F766E" font-size="14" font-weight="700" text-anchor="middle">意图入口</text><text x="938" y="242" fill="#607086" font-size="14" font-weight="400" text-anchor="start"><tspan x="938" dy="0">画像 + 长期历史 + 当前会话上下文</tspan></text><rect x="806" y="314" width="112" height="34" rx="6" fill="#E7F8F4"/><text x="862.0" y="337" fill="#0F766E" font-size="14" font-weight="700" text-anchor="middle">库存重点</text><text x="938" y="330" fill="#607086" font-size="14" font-weight="400" text-anchor="start"><tspan x="938" dy="0">动态上下架、版权、地域、安全与新鲜度</tspan></text><rect x="806" y="402" width="112" height="34" rx="6" fill="#E7F8F4"/><text x="862.0" y="425" fill="#0F766E" font-size="14" font-weight="700" text-anchor="middle">核心难点</text><text x="938" y="418" fill="#607086" font-size="14" font-weight="400" text-anchor="start"><tspan x="938" dy="0">多兴趣、冷启动、探索与信息茧房</tspan></text><rect x="806" y="490" width="112" height="34" rx="6" fill="#E7F8F4"/><text x="862.0" y="513" fill="#0F766E" font-size="14" font-weight="700" text-anchor="middle">反馈偏差</text><text x="938" y="506" fill="#607086" font-size="14" font-weight="400" text-anchor="start"><tspan x="938" dy="0">只看见旧策略曝光过的物品</tspan></text><rect x="806" y="578" width="112" height="34" rx="6" fill="#E7F8F4"/><text x="862.0" y="601" fill="#0F766E" font-size="14" font-weight="700" text-anchor="middle">延迟</text><text x="938" y="594" fill="#607086" font-size="14" font-weight="400" text-anchor="start"><tspan x="938" dy="0">高 QPS Feed，近期兴趣需在线更新</tspan></text><rect x="250" y="728" width="940" height="116" rx="8" fill="#172033"/><text x="720" y="766" fill="#FFFFFF" font-size="20" font-weight="700" text-anchor="middle">共同排序骨架</text><rect x="286" y="788" width="126" height="34" rx="6" fill="#27364A"/><text x="349.0" y="811" fill="#D7DFEA" font-size="14" font-weight="700" text-anchor="middle">资格过滤</text><rect x="434" y="788" width="126" height="34" rx="6" fill="#27364A"/><text x="497.0" y="811" fill="#D7DFEA" font-size="14" font-weight="700" text-anchor="middle">多路召回</text><rect x="582" y="788" width="126" height="34" rx="6" fill="#27364A"/><text x="645.0" y="811" fill="#D7DFEA" font-size="14" font-weight="700" text-anchor="middle">粗排</text><rect x="730" y="788" width="126" height="34" rx="6" fill="#27364A"/><text x="793.0" y="811" fill="#D7DFEA" font-size="14" font-weight="700" text-anchor="middle">精排</text><rect x="878" y="788" width="126" height="34" rx="6" fill="#27364A"/><text x="941.0" y="811" fill="#D7DFEA" font-size="14" font-weight="700" text-anchor="middle">重排</text><rect x="1026" y="788" width="126" height="34" rx="6" fill="#27364A"/><text x="1089.0" y="811" fill="#D7DFEA" font-size="14" font-weight="700" text-anchor="middle">A/B 验证</text>
  </g>
</svg>
