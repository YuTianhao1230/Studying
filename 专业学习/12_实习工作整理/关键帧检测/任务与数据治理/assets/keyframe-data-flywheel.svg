<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">关键帧数据飞轮</title>
  <desc id="desc">固定模型筛选高价值样本，经过 GT 门禁、人工复核、数据更新、训练和固定分桶评测形成闭环。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">数据飞轮：模型筛高价值样本，GT 门禁先判真伪，再回流训练</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">主动学习不是把所有错误都送去标注，而是把资源投向高价值、低置信和有分歧的样本。</text><rect x="520" y="154" width="400" height="102" rx="8" fill="#E8F0FF" stroke="#2563EB"/><text x="720.0" y="190" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">固定模型预测</text><text x="720.0" y="220" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="720.0" dy="0">同批数据，多模型 / 多版本</tspan></text><rect x="1000" y="294" width="310" height="112" rx="8" fill="#F1EAFE" stroke="#6D28D9"/><text x="1155.0" y="330" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">候选筛选</text><text x="1155.0" y="360" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1155.0" dy="0">错误并集 / 模型分歧</tspan><tspan x="1155.0" dy="22">低 ACC / 高优业务</tspan></text><rect x="960" y="570" width="350" height="128" rx="8" fill="#FFF4DD" stroke="#B45309"/><text x="1135.0" y="606" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">人工复核与 GT 门禁</text><text x="1135.0" y="636" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1135.0" dy="0">数据层 → 标准层 → 模型层</tspan><tspan x="1135.0" dy="22">脏 GT 不直接回流</tspan></text><rect x="530" y="684" width="380" height="108" rx="8" fill="#ECFDF3" stroke="#15803D"/><text x="720.0" y="720" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">分桶评测</text><text x="720.0" y="750" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="720.0" dy="0">固定全量集 + 困难集</tspan><tspan x="720.0" dy="22">业务线 / task_type / early-late</tspan></text><rect x="130" y="570" width="350" height="128" rx="8" fill="#E7F8F4" stroke="#0F766E"/><text x="305.0" y="606" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">训练数据更新</text><text x="305.0" y="636" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="305.0" dy="0">relabel / hard negative</tspan><tspan x="305.0" dy="22">按价值与覆盖调整采样</tspan></text><rect x="130" y="294" width="310" height="112" rx="8" fill="#E8F0FF" stroke="#2563EB"/><text x="285.0" y="330" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">重新训练</text><text x="285.0" y="360" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="285.0" dy="0">冻结实验变量</tspan><tspan x="285.0" dy="22">记录数据与模型版本</tspan></text><path d="M920 205 C1030 205 1080 240 1120 286" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M1155 406 C1190 470 1175 520 1138 562" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><path d="M960 650 C900 700 870 716 918 730" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow-orange)"/><path d="M530 738 C480 738 460 700 440 690" fill="none" stroke="#15803D" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M305 570 C270 520 270 460 300 414" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M440 350 C470 250 500 230 512 220" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="570" y="346" width="300" height="174" rx="8" fill="#172033" stroke="#172033"/><text x="720.0" y="382" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">样本价值函数</text><text x="720.0" y="412" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="720.0" dy="0">业务优先级</tspan><tspan x="720.0" dy="22">模型分歧 / 帧误差</tspan><tspan x="720.0" dy="22">数据稀缺度</tspan><tspan x="720.0" dy="22">错误类型覆盖</tspan></text><rect x="72" y="824" width="1296" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="720" y="854" fill="#607086" font-size="14" font-weight="400" text-anchor="middle">闭环有效的证据：固定评测集上分桶提升，且 relabel、无变化、链路异常与真实模型错误分别统计。</text>
  </g>
</svg>
