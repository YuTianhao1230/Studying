<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">混合精度训练的数据精度分工</title>
  <desc id="desc">展示 FP16 或 BF16 用于矩阵计算，FP32 用于敏感算子和参数更新，并说明 FP16 动态 Loss Scaling 的放大、检查、还原流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#607086"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700">混合精度：低精度负责吞吐，FP32 守住数值稳定</text>
    <text x="72" y="101" fill="#607086" font-size="18">“混合”不是全程 16 位，而是由 autocast 和优化器按算子与状态选择合适精度。</text>

    <rect x="72" y="146" width="1296" height="414" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="184" fill="#172033" font-size="21" font-weight="700">一次训练迭代的数据路径</text>

    <g transform="translate(100 229)">
      <rect width="196" height="128" rx="8" fill="#E8EEF5" stroke="#AAB6C5"/>
      <text x="98" y="36" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">FP32 主权重</text>
      <text x="98" y="68" text-anchor="middle" fill="#607086" font-size="14">高精度参数副本</text>
      <text x="98" y="94" text-anchor="middle" fill="#607086" font-size="14">Adam 状态常为 FP32</text>
      <text x="98" y="116" text-anchor="middle" fill="#607086" font-size="13">用于稳定更新</text>
    </g>
    <line x1="296" y1="293" x2="368" y2="293" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="332" y="275" text-anchor="middle" fill="#607086" font-size="13">cast</text>

    <g transform="translate(368 229)">
      <rect width="224" height="128" rx="8" fill="#DBEAFE" stroke="#93B4F5"/>
      <text x="112" y="36" text-anchor="middle" fill="#1D4ED8" font-size="18" font-weight="700">FP16 / BF16 计算</text>
      <text x="112" y="68" text-anchor="middle" fill="#42669B" font-size="14">GEMM · Attention · Conv</text>
      <text x="112" y="94" text-anchor="middle" fill="#42669B" font-size="14">Tensor Core 高吞吐</text>
      <text x="112" y="116" text-anchor="middle" fill="#42669B" font-size="13">激活与通信字节更少</text>
    </g>
    <line x1="592" y1="293" x2="664" y2="293" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(664 229)">
      <rect width="218" height="128" rx="8" fill="#F1EAFE" stroke="#B69AE8"/>
      <text x="109" y="36" text-anchor="middle" fill="#5720A3" font-size="18" font-weight="700">FP32 敏感算子</text>
      <text x="109" y="68" text-anchor="middle" fill="#6A4B93" font-size="14">归约 · Softmax · Loss</text>
      <text x="109" y="94" text-anchor="middle" fill="#6A4B93" font-size="14">框架按白名单提升精度</text>
      <text x="109" y="116" text-anchor="middle" fill="#6A4B93" font-size="13">减少舍入误差累积</text>
    </g>
    <line x1="882" y1="293" x2="954" y2="293" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(954 229)">
      <rect width="224" height="128" rx="8" fill="#CCFBF1" stroke="#7BC7B9"/>
      <text x="112" y="36" text-anchor="middle" fill="#0B5E57" font-size="18" font-weight="700">低精度反向</text>
      <text x="112" y="68" text-anchor="middle" fill="#356C67" font-size="14">计算梯度</text>
      <text x="112" y="94" text-anchor="middle" fill="#356C67" font-size="14">必要时累积为 FP32</text>
      <text x="112" y="116" text-anchor="middle" fill="#356C67" font-size="13">随后交给优化器</text>
    </g>
    <path d="M1178 293 H1260 V421 H199 V373" fill="none" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="724" y="446" text-anchor="middle" fill="#607086" font-size="15" font-weight="700">检查梯度 → FP32 optimizer step → 更新主权重 → 下一步</text>

    <g transform="translate(100 479)">
      <rect width="396" height="53" rx="6" fill="#E8F0FF"/>
      <text x="198" y="33" text-anchor="middle" fill="#1D4ED8" font-size="15" font-weight="700">收益：显存下降 · 带宽压力下降 · Tensor Core 加速</text>
      <rect x="424" width="396" height="53" rx="6" fill="#FFF4DD"/>
      <text x="622" y="33" text-anchor="middle" fill="#92400E" font-size="15" font-weight="700">前提：硬件与算子原生支持 · 收敛和精度需验证</text>
      <rect x="848" width="348" height="53" rx="6" fill="#FEE2E2"/>
      <text x="1022" y="33" text-anchor="middle" fill="#B91C1C" font-size="15" font-weight="700">风险：Overflow · Underflow · NaN / Inf</text>
    </g>

    <rect x="72" y="600" width="628" height="236" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="638" fill="#172033" font-size="20" font-weight="700">FP16 与 BF16 为什么行为不同？</text>
    <g transform="translate(100 675)">
      <text x="0" y="22" fill="#172033" font-size="16" font-weight="700">FP16</text>
      <rect x="74" width="30" height="34" fill="#FCA5A5"/>
      <rect x="104" width="150" height="34" fill="#FCD34D"/>
      <rect x="254" width="300" height="34" fill="#93C5FD"/>
      <text x="89" y="23" text-anchor="middle" fill="#7F1D1D" font-size="13" font-weight="700">S</text>
      <text x="179" y="23" text-anchor="middle" fill="#78350F" font-size="13" font-weight="700">指数 5 bit</text>
      <text x="404" y="23" text-anchor="middle" fill="#1E3A8A" font-size="13" font-weight="700">尾数 10 bit</text>
      <text x="74" y="58" fill="#607086" font-size="14">范围窄、精度较细，常配动态 Loss Scaling</text>
      <text x="0" y="103" fill="#172033" font-size="16" font-weight="700">BF16</text>
      <rect x="74" y="81" width="30" height="34" fill="#FCA5A5"/>
      <rect x="104" y="81" width="240" height="34" fill="#86EFAC"/>
      <rect x="344" y="81" width="210" height="34" fill="#C4B5FD"/>
      <text x="89" y="104" text-anchor="middle" fill="#7F1D1D" font-size="13" font-weight="700">S</text>
      <text x="224" y="104" text-anchor="middle" fill="#14532D" font-size="13" font-weight="700">指数 8 bit</text>
      <text x="449" y="104" text-anchor="middle" fill="#4C1D95" font-size="13" font-weight="700">尾数 7 bit</text>
      <text x="74" y="139" fill="#607086" font-size="14">范围接近 FP32、精度较粗，通常无需 Loss Scaling</text>
    </g>

    <rect x="740" y="600" width="628" height="236" rx="8" fill="#172033"/>
    <text x="768" y="638" fill="#FFFFFF" font-size="20" font-weight="700">FP16 动态 Loss Scaling</text>
    <g transform="translate(768 681)">
      <rect width="118" height="60" rx="6" fill="#E8F0FF"/>
      <text x="59" y="25" text-anchor="middle" fill="#1D4ED8" font-size="14" font-weight="700">Loss × S</text>
      <text x="59" y="45" text-anchor="middle" fill="#42669B" font-size="12">放大梯度</text>
      <line x1="118" y1="30" x2="166" y2="30" stroke="#D7DFEA" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="166" width="118" height="60" rx="6" fill="#F1EAFE"/>
      <text x="225" y="25" text-anchor="middle" fill="#5720A3" font-size="14" font-weight="700">Backward</text>
      <text x="225" y="45" text-anchor="middle" fill="#6A4B93" font-size="12">FP16 路径</text>
      <line x1="284" y1="30" x2="332" y2="30" stroke="#D7DFEA" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="332" width="118" height="60" rx="6" fill="#FFF4DD"/>
      <text x="391" y="25" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700">÷ S</text>
      <text x="391" y="45" text-anchor="middle" fill="#805B28" font-size="12">还原并检查</text>
      <line x1="450" y1="30" x2="498" y2="30" stroke="#D7DFEA" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="498" width="102" height="60" rx="6" fill="#CCFBF1"/>
      <text x="549" y="25" text-anchor="middle" fill="#0B5E57" font-size="14" font-weight="700">更新</text>
      <text x="549" y="45" text-anchor="middle" fill="#356C67" font-size="12">无 Inf/NaN</text>
      <text x="0" y="100" fill="#FDE68A" font-size="14">检测到 Inf/NaN：跳过本步并减小 S；连续稳定：尝试增大 S。</text>
    </g>
  </g>
</svg>
