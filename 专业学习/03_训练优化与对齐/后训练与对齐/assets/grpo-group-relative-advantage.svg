<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">GRPO 组内相对优势</title>
  <desc id="desc">展示同一个 prompt 采样多个回答，经 verifier 得到奖励后在组内标准化成相对优势，再通过裁剪目标和可选 KL 更新策略，无需 Critic。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#607086"/>
    </marker>
    <marker id="arrowPurple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700">GRPO：不训练 Critic，用同题候选的相对表现构造优势</text>
    <text x="72" y="101" fill="#607086" font-size="18">学习信号来自组内差异：高于组均值得正优势，低于组均值得负优势。</text>

    <rect x="72" y="146" width="1296" height="486" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="184" fill="#172033" font-size="21" font-weight="700">同一个 prompt 的一轮训练</text>

    <rect x="100" y="300" width="150" height="90" rx="8" fill="#E8EEF5" stroke="#AAB6C5"/>
    <text x="175" y="336" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">Prompt q</text>
    <text x="175" y="365" text-anchor="middle" fill="#607086" font-size="14">同题采样 G 次</text>
    <line x1="250" y1="345" x2="310" y2="345" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(310 216)">
      <rect width="252" height="318" rx="8" fill="#F1EAFE" stroke="#B69AE8"/>
      <text x="126" y="35" text-anchor="middle" fill="#5720A3" font-size="18" font-weight="700">Policy Rollout</text>
      <g transform="translate(24 62)">
        <rect width="204" height="46" rx="5" fill="#FFFFFF"/>
        <rect y="58" width="204" height="46" rx="5" fill="#FFFFFF"/>
        <rect y="116" width="204" height="46" rx="5" fill="#FFFFFF"/>
        <rect y="174" width="204" height="46" rx="5" fill="#FFFFFF"/>
        <g fill="#172033" font-size="14" font-weight="700">
          <text x="16" y="29">回答 y₁</text><text x="16" y="87">回答 y₂</text>
          <text x="16" y="145">回答 y₃</text><text x="16" y="203">回答 y₄</text>
        </g>
        <g fill="#6A4B93" font-size="12" text-anchor="end">
          <text x="188" y="29">old log-prob</text><text x="188" y="87">old log-prob</text>
          <text x="188" y="145">old log-prob</text><text x="188" y="203">old log-prob</text>
        </g>
      </g>
      <text x="126" y="302" text-anchor="middle" fill="#6A4B93" font-size="13">本批数据来自 πold</text>
    </g>

    <line x1="562" y1="375" x2="622" y2="375" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(622 216)">
      <rect width="252" height="318" rx="8" fill="#FFF4DD" stroke="#E4B55B"/>
      <text x="126" y="35" text-anchor="middle" fill="#92400E" font-size="18" font-weight="700">Verifier → Reward</text>
      <g transform="translate(24 62)">
        <rect width="204" height="46" rx="5" fill="#CCFBF1"/>
        <rect y="58" width="204" height="46" rx="5" fill="#FEE2E2"/>
        <rect y="116" width="204" height="46" rx="5" fill="#FEE2E2"/>
        <rect y="174" width="204" height="46" rx="5" fill="#CCFBF1"/>
        <g font-size="14" font-weight="700">
          <text x="16" y="29" fill="#0B5E57">通过检查</text><text x="188" y="29" text-anchor="end" fill="#0B5E57">r₁ = 1</text>
          <text x="16" y="87" fill="#B91C1C">未通过</text><text x="188" y="87" text-anchor="end" fill="#B91C1C">r₂ = 0</text>
          <text x="16" y="145" fill="#B91C1C">未通过</text><text x="188" y="145" text-anchor="end" fill="#B91C1C">r₃ = 0</text>
          <text x="16" y="203" fill="#0B5E57">通过检查</text><text x="188" y="203" text-anchor="end" fill="#0B5E57">r₄ = 1</text>
        </g>
      </g>
      <text x="126" y="302" text-anchor="middle" fill="#805B28" font-size="13">规则、单测、环境或 Reward Model</text>
    </g>

    <line x1="874" y1="375" x2="934" y2="375" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(934 216)">
      <rect width="252" height="318" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/>
      <text x="126" y="35" text-anchor="middle" fill="#0B5E57" font-size="18" font-weight="700">组内标准化优势</text>
      <text x="126" y="67" text-anchor="middle" fill="#356C67" font-size="14">均值 0.5 · 标准差 0.5</text>
      <g transform="translate(24 84)">
        <rect width="204" height="42" rx="5" fill="#CCFBF1"/>
        <rect y="52" width="204" height="42" rx="5" fill="#FEE2E2"/>
        <rect y="104" width="204" height="42" rx="5" fill="#FEE2E2"/>
        <rect y="156" width="204" height="42" rx="5" fill="#CCFBF1"/>
        <g font-size="15" font-weight="700">
          <text x="16" y="27" fill="#0B5E57">A₁ = +1</text><text x="188" y="27" text-anchor="end" fill="#0B5E57">概率 ↑</text>
          <text x="16" y="79" fill="#B91C1C">A₂ = -1</text><text x="188" y="79" text-anchor="end" fill="#B91C1C">概率 ↓</text>
          <text x="16" y="131" fill="#B91C1C">A₃ = -1</text><text x="188" y="131" text-anchor="end" fill="#B91C1C">概率 ↓</text>
          <text x="16" y="183" fill="#0B5E57">A₄ = +1</text><text x="188" y="183" text-anchor="end" fill="#0B5E57">概率 ↑</text>
        </g>
      </g>
      <text x="126" y="302" text-anchor="middle" fill="#356C67" font-size="13">Aᵢ = (rᵢ - mean) / (std + ε)</text>
    </g>

    <line x1="1186" y1="375" x2="1246" y2="375" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <g transform="translate(1246 288)">
      <rect width="94" height="174" rx="8" fill="#172033"/>
      <text x="47" y="35" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">策略</text>
      <text x="47" y="60" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">更新</text>
      <line x1="20" y1="82" x2="74" y2="82" stroke="#425066"/>
      <text x="47" y="109" text-anchor="middle" fill="#C4B5FD" font-size="13">clip</text>
      <text x="47" y="132" text-anchor="middle" fill="#93B4F5" font-size="13">+ KL</text>
      <text x="47" y="157" text-anchor="middle" fill="#D7DFEA" font-size="12">无 Critic</text>
    </g>

    <rect x="72" y="672" width="628" height="164" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="710" fill="#172033" font-size="20" font-weight="700">有学习信号</text>
    <text x="100" y="748" fill="#607086" font-size="15">同组奖励有差异，例如 [1, 0, 0, 1]</text>
    <rect x="100" y="774" width="548" height="36" rx="5" fill="#E7F8F4"/>
    <text x="374" y="798" text-anchor="middle" fill="#0B5E57" font-size="15" font-weight="700">高分回答上调，低分回答下调</text>

    <rect x="740" y="672" width="628" height="164" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="768" y="710" fill="#172033" font-size="20" font-weight="700">组内策略信号消失</text>
    <text x="768" y="748" fill="#607086" font-size="15">同组全同分，例如 [0, 0, 0, 0] 或 [1, 1, 1, 1]</text>
    <rect x="768" y="774" width="548" height="36" rx="5" fill="#FEE2E2"/>
    <text x="1042" y="798" text-anchor="middle" fill="#B91C1C" font-size="15" font-weight="700">Aᵢ = 0；仅 KL 或其他 batch 样本还可能更新</text>

    <text x="720" y="872" text-anchor="middle" fill="#607086" font-size="15">训练必须监控 reward_std、零方差组比例、解析率与独立业务指标，不能只看平均 reward。</text>
  </g>
</svg>
