<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
  <title id="title">PPO-RLHF 四模型分工</title>
  <desc id="desc">PPO-RLHF 先由 Policy 生成回答，再由 Reward Model、Critic 和 Reference 分别提供代理奖励、状态价值和 KL 约束，最后通过策略损失更新 Policy、通过价值损失更新 Critic。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#607086"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="1440" height="1050" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Droid Sans Fallback, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="62" fill="#172033" font-size="34" font-weight="700">PPO-RLHF：四个模型的职责与数据流</text>
    <text x="72" y="99" fill="#607086" font-size="18">Policy 负责生成，Reward 负责评分，Critic 负责估值，Reference 负责约束。</text>

    <rect x="72" y="136" width="1296" height="738" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>

    <rect x="100" y="164" width="94" height="30" rx="15" fill="#172033"/>
    <text x="147" y="185" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">1 生成回答</text>

    <g transform="translate(180 210)">
      <rect width="180" height="80" rx="8" fill="#E8EEF5" stroke="#AAB6C5"/>
      <text x="90" y="34" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">Prompt</text>
      <text x="90" y="60" text-anchor="middle" fill="#607086" font-size="14">训练样本 q</text>
    </g>

    <path d="M360 250 L463 250" fill="none" stroke="#607086" stroke-width="2.5" marker-end="url(#arrow)"/>

    <g transform="translate(475 200)">
      <rect width="260" height="100" rx="8" fill="#F1EAFE" stroke="#B69AE8" stroke-width="2"/>
      <rect x="172" y="14" width="68" height="28" rx="14" fill="#7C3AED"/>
      <text x="206" y="33" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">更新</text>
      <text x="24" y="38" fill="#5720A3" font-size="20" font-weight="700">Policy Model</text>
      <text x="24" y="67" fill="#6A4B93" font-size="14">输入：q + 前缀</text>
      <text x="24" y="89" fill="#172033" font-size="14">输出：下一个 token 概率</text>
    </g>

    <path d="M735 250 L838 250" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrowPurple)"/>

    <g transform="translate(850 210)">
      <rect width="220" height="80" rx="8" fill="#E8EEF5" stroke="#AAB6C5"/>
      <text x="110" y="34" text-anchor="middle" fill="#172033" font-size="18" font-weight="700">Rollout 回答</text>
      <text x="110" y="60" text-anchor="middle" fill="#607086" font-size="14">完整序列 y 与各前缀</text>
    </g>

    <rect x="100" y="336" width="94" height="30" rx="15" fill="#172033"/>
    <text x="147" y="357" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">2 产生信号</text>

    <path d="M960 290 L960 350 L320 350" fill="none" stroke="#607086" stroke-width="2"/>
    <path d="M700 350 L700 388" fill="none" stroke="#607086" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1080 350 L1080 388" fill="none" stroke="#607086" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M320 350 L320 388" fill="none" stroke="#607086" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M960 350 L1080 350" fill="none" stroke="#607086" stroke-width="2"/>

    <g transform="translate(180 400)">
      <rect width="280" height="150" rx="8" fill="#FFF4DD" stroke="#E4B55B"/>
      <rect x="187" y="14" width="69" height="28" rx="14" fill="#B45309"/>
      <text x="221.5" y="33" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">冻结</text>
      <text x="24" y="39" fill="#92400E" font-size="20" font-weight="700">Reward Model</text>
      <text x="24" y="70" fill="#172033" font-size="14">输入：q + 完整回答</text>
      <text x="24" y="97" fill="#172033" font-size="14">输出：代理奖励 rRM</text>
      <text x="24" y="126" fill="#805B28" font-size="14">评价回答整体质量</text>
    </g>

    <g transform="translate(560 400)">
      <rect width="280" height="150" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/>
      <rect x="187" y="14" width="69" height="28" rx="14" fill="#0F766E"/>
      <text x="221.5" y="33" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">更新</text>
      <text x="24" y="39" fill="#0B5E57" font-size="20" font-weight="700">Value Model / Critic</text>
      <text x="24" y="70" fill="#172033" font-size="14">输入：q + 每个生成前缀</text>
      <text x="24" y="97" fill="#172033" font-size="14">输出：状态价值 Vt</text>
      <text x="24" y="126" fill="#356C67" font-size="14">预测未来期望回报</text>
    </g>

    <g transform="translate(940 400)">
      <rect width="280" height="150" rx="8" fill="#EAF2FF" stroke="#8EB4E8"/>
      <rect x="187" y="14" width="69" height="28" rx="14" fill="#356EAD"/>
      <text x="221.5" y="33" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">冻结</text>
      <text x="24" y="39" fill="#24578F" font-size="20" font-weight="700">Reference Model</text>
      <text x="24" y="70" fill="#172033" font-size="14">输入：同一前缀与 token</text>
      <text x="24" y="97" fill="#172033" font-size="14">输出：参考 log-prob</text>
      <text x="24" y="126" fill="#456B96" font-size="14">提供 KL 能力锚点</text>
    </g>

    <rect x="100" y="584" width="94" height="30" rx="15" fill="#172033"/>
    <text x="147" y="605" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">3 优化参数</text>

    <path d="M320 550 L320 618" fill="none" stroke="#607086" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="335" y="592" fill="#805B28" font-size="14" font-weight="700">rRM</text>
    <path d="M700 550 L700 618" fill="none" stroke="#607086" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="715" y="592" fill="#356C67" font-size="14" font-weight="700">Vt</text>
    <path d="M1080 550 L1080 618" fill="none" stroke="#607086" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1095" y="592" fill="#456B96" font-size="14" font-weight="700">KL</text>

    <g transform="translate(180 630)">
      <rect width="650" height="145" rx="8" fill="#172033"/>
      <text x="325" y="35" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">Return 与 Advantage</text>
      <text x="325" y="70" text-anchor="middle" fill="#D7DFEA" font-size="14">代理 reward + 其他任务反馈 → return target Gt</text>
      <text x="325" y="99" text-anchor="middle" fill="#D7DFEA" font-size="14">奖励序列 + Critic 的 Vt → GAE → Advantage Ât</text>
      <text x="325" y="126" text-anchor="middle" fill="#93A4BA" font-size="13">Critic 是 baseline，不是最终答案的评分器</text>
    </g>

    <g transform="translate(900 630)">
      <rect width="320" height="105" rx="8" fill="#F1EAFE" stroke="#B69AE8" stroke-width="2"/>
      <text x="160" y="32" text-anchor="middle" fill="#5720A3" font-size="18" font-weight="700">Policy loss</text>
      <text x="160" y="59" text-anchor="middle" fill="#6A4B93" font-size="14">clipped surrogate + β KL</text>
      <text x="160" y="85" text-anchor="middle" fill="#5720A3" font-size="14" font-weight="700">更新 Policy 参数 θ</text>
    </g>

    <g transform="translate(900 755)">
      <rect width="320" height="100" rx="8" fill="#E7F8F4" stroke="#7BC7B9" stroke-width="2"/>
      <text x="160" y="31" text-anchor="middle" fill="#0B5E57" font-size="18" font-weight="700">Value loss</text>
      <text x="160" y="58" text-anchor="middle" fill="#356C67" font-size="14">(Vt - Gt)²</text>
      <text x="160" y="83" text-anchor="middle" fill="#0B5E57" font-size="14" font-weight="700">更新 Critic 参数 φ</text>
    </g>

    <path d="M830 675 L888 675" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrowPurple)"/>
    <text x="859" y="663" text-anchor="middle" fill="#5720A3" font-size="14" font-weight="700">Ât</text>
    <path d="M830 735 C858 744 860 805 888 805" fill="none" stroke="#607086" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="857" y="783" text-anchor="middle" fill="#356C67" font-size="14" font-weight="700">Gt</text>

    <text x="180" y="825" fill="#607086" font-size="14">图中采用显式 KL 正则；若将 KL 作为 reward shaping，则不在 Policy loss 中重复加入。</text>
    <text x="180" y="851" fill="#607086" font-size="13">ρt 的分母来自本批旧 log-prob；πold ≠ πref。</text>

    <rect x="72" y="902" width="1296" height="106" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="941" fill="#172033" font-size="20" font-weight="700">GRPO 的变化</text>
    <rect x="100" y="961" width="216" height="30" rx="15" fill="#F1EAFE"/>
    <text x="208" y="982" text-anchor="middle" fill="#5720A3" font-size="14" font-weight="700">保留并更新 Policy</text>
    <rect x="336" y="961" width="230" height="30" rx="15" fill="#FFF4DD"/>
    <text x="451" y="982" text-anchor="middle" fill="#92400E" font-size="14" font-weight="700">仍需可靠 reward 来源</text>
    <rect x="586" y="961" width="230" height="30" rx="15" fill="#EAF2FF"/>
    <text x="701" y="982" text-anchor="middle" fill="#24578F" font-size="14" font-weight="700">Reference 可选</text>
    <rect x="836" y="961" width="448" height="30" rx="15" fill="#E7F8F4"/>
    <text x="1060" y="982" text-anchor="middle" fill="#0B5E57" font-size="14" font-weight="700">移除 Critic，用同题组内奖励统计构造 Advantage</text>

    <text x="720" y="1037" text-anchor="middle" fill="#607086" font-size="14">记忆：Policy 生成，Reward 评分，Critic 估值，Reference 约束。</text>
  </g>
</svg>
