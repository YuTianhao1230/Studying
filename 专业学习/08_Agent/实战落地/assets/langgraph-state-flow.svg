<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">LangGraph 状态图</title>
  <desc id="desc">LangGraph 通过 state、node、edge、reducer 和 checkpoint 编排可恢复 Agent 工作流。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">LangGraph：State 贯穿节点，Reducer 收拢并行，Checkpoint 支持恢复</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">图只表达控制关系；业务计算、工具契约与权限仍由各自模块负责。</text><rect x="72" y="180" width="188" height="84" rx="8" fill="#E8F0FF" stroke="#2563EB"/><text x="166.0" y="229.0" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">校验请求</text><rect x="292" y="180" width="188" height="84" rx="8" fill="#F1EAFE" stroke="#6D28D9"/><text x="386.0" y="229.0" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">采集 / 标准化</text><rect x="512" y="180" width="188" height="84" rx="8" fill="#E7F8F4" stroke="#0F766E"/><text x="606.0" y="229.0" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">组件匹配</text><line x1="260" y1="222" x2="284" y2="222" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><line x1="480" y1="222" x2="504" y2="222" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><path d="M700 222 C770 222 760 350 820 350" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="720" y="306" width="140" height="88" rx="8" fill="#E8F0FF" stroke="#93B4F5"/><text x="790.0" y="342" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">颜色</text><text x="790.0" y="372" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="790.0" dy="0">独立字段</tspan></text><rect x="880" y="306" width="140" height="88" rx="8" fill="#E8F0FF" stroke="#93B4F5"/><text x="950.0" y="342" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">圆角</text><text x="950.0" y="372" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="950.0" dy="0">独立字段</tspan></text><rect x="1040" y="306" width="140" height="88" rx="8" fill="#E8F0FF" stroke="#93B4F5"/><text x="1110.0" y="342" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">尺寸</text><text x="1110.0" y="372" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1110.0" dy="0">独立字段</tspan></text><rect x="1200" y="306" width="140" height="88" rx="8" fill="#E8F0FF" stroke="#93B4F5"/><text x="1270.0" y="342" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">间距 / 字体</text><text x="1270.0" y="372" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1270.0" dy="0">独立字段</tspan></text><path d="M606 264 C606 292 790 278 790 298" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M790 394 C790 450 890 450 890 482" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><path d="M606 264 C606 292 950 278 950 298" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M950 394 C950 450 890 450 890 482" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><path d="M606 264 C606 292 1110 278 1110 298" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M1110 394 C1110 450 890 450 890 482" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><path d="M606 264 C606 292 1270 278 1270 298" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M1270 394 C1270 450 890 450 890 482" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="700" y="490" width="380" height="112" rx="8" fill="#F1EAFE" stroke="#B69AE8"/><text x="890.0" y="526" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">Reducer / Merge</text><text x="890.0" y="556" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="890.0" dy="0">显式合并字段与顺序</tspan><tspan x="890.0" dy="22">聚合 SUCCESS / PARTIAL / FAILED</tspan></text><line x1="890" y1="602" x2="890" y2="652" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="700" y="660" width="380" height="94" rx="8" fill="#ECFDF3" stroke="#86D3A0"/><text x="890.0" y="696" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">过滤 → 报告 → 发布</text><text x="890.0" y="726" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="890.0" dy="0">副作用使用幂等键</tspan></text><rect x="72" y="322" width="548" height="432" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="100" y="362" fill="#172033" font-size="21" font-weight="700" text-anchor="start">State + Checkpoint</text><rect x="100" y="392" width="492" height="58" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/><text x="122" y="428" fill="#172033" font-size="16" font-weight="700" text-anchor="start">请求与输入</text><text x="276" y="428" fill="#607086" font-size="13" font-weight="400" text-anchor="start">request_id / task_type / artifact</text><rect x="100" y="468" width="492" height="58" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/><text x="122" y="504" fill="#172033" font-size="16" font-weight="700" text-anchor="start">版本与证据</text><text x="276" y="504" fill="#607086" font-size="13" font-weight="400" text-anchor="start">code / model / prompt / rule</text><rect x="100" y="544" width="492" height="58" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/><text x="122" y="580" fill="#172033" font-size="16" font-weight="700" text-anchor="start">控制字段</text><text x="276" y="580" fill="#607086" font-size="13" font-weight="400" text-anchor="start">deadline / budget / cancel</text><rect x="100" y="620" width="492" height="58" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/><text x="122" y="656" fill="#172033" font-size="16" font-weight="700" text-anchor="start">状态语义</text><text x="276" y="656" fill="#607086" font-size="13" font-weight="400" text-anchor="start">None ≠ [] ≠ FAILED ≠ SKIPPED</text><rect x="100" y="704" width="492" height="34" rx="6" fill="#FFF4DD"/><text x="346.0" y="727" fill="#B45309" font-size="14" font-weight="700" text-anchor="middle">thread_id 隔离执行；副作用前后设置 checkpoint</text><text x="720" y="840" fill="#607086" font-size="16" font-weight="400" text-anchor="middle">并行节点不得覆盖同一普通字段；恢复时复用 checkpoint 与幂等结果。</text>
  </g>
</svg>
