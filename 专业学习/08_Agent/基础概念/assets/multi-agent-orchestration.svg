<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Agent 编排</title>
  <desc id="desc">主 Agent 将可独立子任务交给专门 Worker，统一合并并验证结果。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">Multi-Agent：主 Agent 拆目标，Worker 独立取证，主 Agent 统一收口</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">收益来自自然并行和上下文隔离；代价是通信、冲突、延迟与错误传播。</text><rect x="490" y="150" width="460" height="112" rx="8" fill="#F1EAFE" stroke="#B69AE8"/><text x="720.0" y="186" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">Orchestrator / 主 Agent</text><text x="720.0" y="216" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="720.0" dy="0">拆解子目标 · 定义接口 · 分配权限</tspan><tspan x="720.0" dy="22">保留最终决策与交付责任</tspan></text><rect x="90" y="390" width="260" height="150" rx="8" fill="#E8F0FF" stroke="#2563EB"/><text x="220.0" y="426" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">Research Worker</text><text x="220.0" y="456" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="220.0" dy="0">检索资料</tspan><tspan x="220.0" dy="22">返回证据与来源</tspan></text><path d="M720 262 C720 322 220 318 220 382" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="410" y="390" width="260" height="150" rx="8" fill="#E7F8F4" stroke="#0F766E"/><text x="540.0" y="426" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">Coding Worker</text><text x="540.0" y="456" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="540.0" dy="0">实现局部模块</tspan><tspan x="540.0" dy="22">返回 diff 与测试</tspan></text><path d="M720 262 C720 322 540 318 540 382" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="730" y="390" width="260" height="150" rx="8" fill="#FFF4DD" stroke="#B45309"/><text x="860.0" y="426" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">Review Worker</text><text x="860.0" y="456" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="860.0" dy="0">独立审查</tspan><tspan x="860.0" dy="22">返回风险与定位</tspan></text><path d="M720 262 C720 322 860 318 860 382" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="1050" y="390" width="260" height="150" rx="8" fill="#ECFDF3" stroke="#15803D"/><text x="1180.0" y="426" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">Test Worker</text><text x="1180.0" y="456" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1180.0" dy="0">运行验证</tspan><tspan x="1180.0" dy="22">返回结构化结果</tspan></text><path d="M720 262 C720 322 1180 318 1180 382" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="400" y="650" width="640" height="104" rx="8" fill="#172033" stroke="#172033"/><text x="720.0" y="686" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">Merge + Verify</text><text x="720.0" y="716" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="720.0" dy="0">按预定义规则合并；冲突由主 Agent 仲裁</tspan><tspan x="720.0" dy="22">验证证据、接口与完成条件后再输出</tspan></text><path d="M220 540 C220 605 500 615 500 642" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M540 540 C540 605 500 615 500 642" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M860 540 C860 605 500 615 500 642" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M1180 540 C1180 605 500 615 500 642" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="72" y="786" width="1296" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="100" y="823" fill="#172033" font-size="17" font-weight="700" text-anchor="start">使用门槛</text><text x="220" y="823" fill="#2563EB" font-size="15" font-weight="700" text-anchor="start">子任务可独立</text><text x="410" y="823" fill="#0F766E" font-size="15" font-weight="700" text-anchor="start">输入输出清晰</text><text x="610" y="823" fill="#B45309" font-size="15" font-weight="700" text-anchor="start">写权限不冲突</text><text x="820" y="823" fill="#6D28D9" font-size="15" font-weight="700" text-anchor="start">结果可验证</text><text x="1000" y="823" fill="#B91C1C" font-size="15" font-weight="700" text-anchor="start">收益高于通信成本</text>
  </g>
</svg>
