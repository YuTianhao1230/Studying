<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Tool Call 运行时链路</title>
  <desc id="desc">模型生成结构化调用意图，编排器校验并执行，工具返回结构化结果。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">Tool Call：模型提出调用意图，编排器负责真实执行</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">把“推理”和“副作用”分开，才能校验参数、鉴权、重试并审计。</text><rect x="72" y="148" width="392" height="590" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="72" y="148" width="392" height="58" rx="8" fill="#E8F0FF"/><text x="268.0" y="185" fill="#2563EB" font-size="21" font-weight="700" text-anchor="middle">LLM</text><rect x="524" y="148" width="392" height="590" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="524" y="148" width="392" height="58" rx="8" fill="#F1EAFE"/><text x="720.0" y="185" fill="#6D28D9" font-size="21" font-weight="700" text-anchor="middle">Orchestrator</text><rect x="976" y="148" width="392" height="590" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><rect x="976" y="148" width="392" height="58" rx="8" fill="#E7F8F4"/><text x="1172.0" y="185" fill="#0F766E" font-size="21" font-weight="700" text-anchor="middle">Tool / Backend</text><rect x="104" y="238" width="328" height="76" rx="8" fill="#E8F0FF" stroke="#93B4F5"/><text x="268.0" y="274" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">1 判断需要工具</text><text x="268.0" y="304" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="268.0" dy="0">选择 tool 名称</tspan><tspan x="268.0" dy="22">生成 JSON 参数</tspan></text><rect x="556" y="346" width="328" height="100" rx="8" fill="#F1EAFE" stroke="#B69AE8"/><text x="720.0" y="382" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">2 校验与授权</text><text x="720.0" y="412" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="720.0" dy="0">schema / scope / 资源</tspan><tspan x="720.0" dy="22">预算 / 幂等 / dry-run</tspan></text><rect x="1008" y="462" width="328" height="84" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/><text x="1172.0" y="498" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">3 执行真实动作</text><text x="1172.0" y="528" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1172.0" dy="0">API / DB / 文件 / 浏览器</tspan></text><rect x="556" y="574" width="328" height="100" rx="8" fill="#FFF4DD" stroke="#E4B55B"/><text x="720.0" y="610" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">4 归一化结果</text><text x="720.0" y="640" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="720.0" dy="0">success / code / evidence</tspan><tspan x="720.0" dy="22">retryable / request_id</tspan></text><rect x="104" y="678" width="328" height="76" rx="8" fill="#ECFDF3" stroke="#86D3A0"/><text x="268.0" y="714" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">5 继续判断或结束</text><text x="268.0" y="744" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="268.0" dy="0">结果进入下一轮上下文</tspan></text><path d="M432 276 C495 276 493 396 548 396" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M884 396 C948 396 946 504 1000 504" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><path d="M1008 520 C948 520 950 624 892 624" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M556 640 C500 640 496 716 440 716" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow-orange)"/><rect x="72" y="776" width="1296" height="68" rx="8" fill="#172033"/><text x="100" y="817" fill="#FFFFFF" font-size="18" font-weight="700" text-anchor="start">责任边界</text><text x="230" y="817" fill="#D7DFEA" font-size="16" font-weight="700" text-anchor="start">模型只表达意图</text><text x="490" y="817" fill="#D7DFEA" font-size="16" font-weight="700" text-anchor="start">编排器决定能否执行</text><text x="790" y="817" fill="#D7DFEA" font-size="16" font-weight="700" text-anchor="start">后端再次鉴权</text><text x="1040" y="817" fill="#D7DFEA" font-size="16" font-weight="700" text-anchor="start">高风险写操作需确认</text>
  </g>
</svg>
