<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">模型量化精度、显存与流程对比</title>
  <desc id="desc">低比特表示减少权重存储和访存，FP16 与 BF16 的指数尾数分配不同，PTQ 与 QAT 在成本和精度上有不同取舍。</desc>
  <rect width="1440" height="940" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700">量化：用更少 bit 表示数值，换显存与吞吐</text>
    <text x="72" y="101" fill="#607086" font-size="18">收益来自存储和访存下降；是否真正提速取决于硬件、内核和量化粒度。</text>

    <rect x="72" y="144" width="1296" height="210" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="182" fill="#172033" font-size="20" font-weight="700">以 7B 参数权重为例（仅看理论权重存储）</text>
    <text x="100" y="229" fill="#355986" font-size="16" font-weight="700">FP16</text>
    <rect x="184" y="207" width="940" height="34" rx="6" fill="#2563EB"/>
    <text x="1146" y="230" fill="#1D4ED8" font-size="16" font-weight="700">约 14 GB</text>
    <text x="100" y="279" fill="#356C67" font-size="16" font-weight="700">INT8</text>
    <rect x="184" y="257" width="470" height="34" rx="6" fill="#0F766E"/>
    <text x="676" y="280" fill="#0F766E" font-size="16" font-weight="700">约 7 GB</text>
    <text x="100" y="329" fill="#805B28" font-size="16" font-weight="700">INT4</text>
    <rect x="184" y="307" width="235" height="34" rx="6" fill="#B45309"/>
    <text x="441" y="330" fill="#B45309" font-size="16" font-weight="700">约 3.5 GB</text>
    <text x="1020" y="320" fill="#607086" font-size="14">实际还包含 scale、zero-point、元数据、</text>
    <text x="1020" y="342" fill="#607086" font-size="14">激活、KV Cache 和运行时工作区。</text>

    <rect x="72" y="390" width="634" height="252" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="428" fill="#172033" font-size="20" font-weight="700">FP16 与 BF16：总位数相同，分配不同</text>
    <text x="100" y="474" fill="#355986" font-size="16" font-weight="700">FP16</text>
    <rect x="178" y="450" width="30" height="48" rx="4" fill="#172033"/>
    <rect x="214" y="450" width="150" height="48" rx="4" fill="#DBEAFE" stroke="#93B4F5"/>
    <rect x="370" y="450" width="300" height="48" rx="4" fill="#CCFBF1" stroke="#7BC7B9"/>
    <text x="193" y="481" text-anchor="middle" fill="#FFFFFF" font-size="13">S</text>
    <text x="289" y="481" text-anchor="middle" fill="#1D4ED8" font-size="14" font-weight="700">指数 5 bit</text>
    <text x="520" y="481" text-anchor="middle" fill="#0F766E" font-size="14" font-weight="700">尾数 10 bit</text>

    <text x="100" y="550" fill="#6A4B93" font-size="16" font-weight="700">BF16</text>
    <rect x="178" y="526" width="30" height="48" rx="4" fill="#172033"/>
    <rect x="214" y="526" width="240" height="48" rx="4" fill="#EDE9FE" stroke="#B69AE8"/>
    <rect x="460" y="526" width="210" height="48" rx="4" fill="#FEF3C7" stroke="#E4B55B"/>
    <text x="193" y="557" text-anchor="middle" fill="#FFFFFF" font-size="13">S</text>
    <text x="334" y="557" text-anchor="middle" fill="#5720A3" font-size="14" font-weight="700">指数 8 bit</text>
    <text x="565" y="557" text-anchor="middle" fill="#B45309" font-size="14" font-weight="700">尾数 7 bit</text>
    <text x="100" y="612" fill="#607086" font-size="15">FP16 小数更细；BF16 动态范围接近 FP32，训练时更不易溢出。</text>

    <rect x="734" y="390" width="634" height="252" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="762" y="428" fill="#172033" font-size="20" font-weight="700">整数化：把连续值映射到有限刻度</text>
    <line x1="800" y1="518" x2="1302" y2="518" stroke="#94A3B8" stroke-width="3"/>
    <g stroke="#94A3B8" stroke-width="2">
      <line x1="820" y1="502" x2="820" y2="534"/><line x1="900" y1="502" x2="900" y2="534"/>
      <line x1="980" y1="502" x2="980" y2="534"/><line x1="1060" y1="502" x2="1060" y2="534"/>
      <line x1="1140" y1="502" x2="1140" y2="534"/><line x1="1220" y1="502" x2="1220" y2="534"/>
      <line x1="1300" y1="502" x2="1300" y2="534"/>
    </g>
    <circle cx="867" cy="486" r="9" fill="#2563EB"/>
    <circle cx="1028" cy="472" r="9" fill="#0F766E"/>
    <circle cx="1189" cy="490" r="9" fill="#B45309"/>
    <path d="M867 495 L900 512 M1028 481 L1060 512 M1189 499 L1220 512" stroke="#607086" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="867" y="462" text-anchor="middle" fill="#1D4ED8" font-size="13">0.31</text>
    <text x="1028" y="448" text-anchor="middle" fill="#0F766E" font-size="13">0.67</text>
    <text x="1189" y="466" text-anchor="middle" fill="#B45309" font-size="13">1.02</text>
    <text x="1060" y="570" text-anchor="middle" fill="#607086" font-size="15">scale / zero-point 决定浮点值与整数格点的映射</text>
    <text x="1060" y="604" text-anchor="middle" fill="#BE123C" font-size="15">格点越少，舍入误差和离群值风险越高</text>

    <rect x="72" y="682" width="1296" height="202" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="720" fill="#172033" font-size="20" font-weight="700">两组关键选择</text>
    <rect x="100" y="748" width="280" height="104" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="240" y="780" text-anchor="middle" fill="#1D4ED8" font-size="18" font-weight="700">Weight-only</text>
    <text x="240" y="808" text-anchor="middle" fill="#355986" font-size="14">只压权重，部署较稳</text>
    <text x="240" y="834" text-anchor="middle" fill="#607086" font-size="14">激活仍保持高精度</text>
    <rect x="400" y="748" width="280" height="104" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="540" y="780" text-anchor="middle" fill="#0F766E" font-size="18" font-weight="700">Weight + Activation</text>
    <text x="540" y="808" text-anchor="middle" fill="#356C67" font-size="14">潜在收益更大</text>
    <text x="540" y="834" text-anchor="middle" fill="#607086" font-size="14">校准与内核要求更高</text>
    <rect x="760" y="748" width="250" height="104" rx="8" fill="#F1EAFE" stroke="#B69AE8"/>
    <text x="885" y="780" text-anchor="middle" fill="#5720A3" font-size="18" font-weight="700">PTQ</text>
    <text x="885" y="808" text-anchor="middle" fill="#6A4B93" font-size="14">训练后校准，成本低</text>
    <text x="885" y="834" text-anchor="middle" fill="#607086" font-size="14">优先作为部署起点</text>
    <rect x="1030" y="748" width="310" height="104" rx="8" fill="#FFF4DD" stroke="#E4B55B"/>
    <text x="1185" y="780" text-anchor="middle" fill="#B45309" font-size="18" font-weight="700">QAT</text>
    <text x="1185" y="808" text-anchor="middle" fill="#805B28" font-size="14">训练中模拟量化误差</text>
    <text x="1185" y="834" text-anchor="middle" fill="#607086" font-size="14">精度通常更好，成本更高</text>
    <text x="720" y="918" text-anchor="middle" fill="#526277" font-size="15">上线判断必须同时看关键能力、长尾 bad case、延迟、吞吐和显存收益</text>
  </g>
</svg>
