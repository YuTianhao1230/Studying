<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">Self-Attention 完整计算流程</title>
  <desc id="desc">输入 X 投影为 Q K V，Q 与 K 转置相乘得到注意力分数，经过缩放、掩码和 Softmax 后对 V 加权聚合。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#607086"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700">Self-Attention：先匹配，再取值</text>
    <text x="72" y="101" fill="#607086" font-size="18">Q 与 K 决定“关注谁”，注意力权重再对 V 中的内容做加权聚合。</text>

    <rect x="72" y="150" width="190" height="104" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="167" y="190" text-anchor="middle" fill="#172033" font-size="24" font-weight="700">输入 X</text>
    <text x="167" y="224" text-anchor="middle" fill="#607086" font-size="17">[n, d]</text>

    <line x1="262" y1="202" x2="352" y2="202" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="307" y="185" text-anchor="middle" fill="#607086" font-size="14">三个线性投影</text>

    <rect x="372" y="128" width="190" height="78" rx="8" fill="#E8F0FF" stroke="#93B4F5"/>
    <text x="467" y="160" text-anchor="middle" fill="#1D4ED8" font-size="21" font-weight="700">Q = XW_Q</text>
    <text x="467" y="187" text-anchor="middle" fill="#355986" font-size="16">[n, d_k]</text>

    <rect x="372" y="218" width="190" height="78" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/>
    <text x="467" y="250" text-anchor="middle" fill="#0F766E" font-size="21" font-weight="700">K = XW_K</text>
    <text x="467" y="277" text-anchor="middle" fill="#356C67" font-size="16">[n, d_k]</text>

    <rect x="372" y="308" width="190" height="78" rx="8" fill="#FFF4DD" stroke="#E4B55B"/>
    <text x="467" y="340" text-anchor="middle" fill="#B45309" font-size="21" font-weight="700">V = XW_V</text>
    <text x="467" y="367" text-anchor="middle" fill="#805B28" font-size="16">[n, d_v]</text>

    <path d="M562 167 C625 167 638 226 682 226" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M562 257 C625 257 638 239 682 239" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="702" y="184" width="220" height="104" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="812" y="220" text-anchor="middle" fill="#172033" font-size="21" font-weight="700">QK^T</text>
    <text x="812" y="250" text-anchor="middle" fill="#607086" font-size="16">相似度分数 [n, n]</text>
    <text x="812" y="273" text-anchor="middle" fill="#607086" font-size="14">每个 Query 对所有 Key</text>

    <line x1="922" y1="236" x2="1010" y2="236" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1030" y="166" width="300" height="140" rx="8" fill="#F1EAFE" stroke="#B69AE8"/>
    <text x="1180" y="202" text-anchor="middle" fill="#5720A3" font-size="20" font-weight="700">缩放 + Mask + Softmax</text>
    <text x="1180" y="235" text-anchor="middle" fill="#6A4B93" font-size="17">A = Softmax(QK^T / √d_k)</text>
    <text x="1180" y="266" text-anchor="middle" fill="#607086" font-size="15">A 的每一行和为 1</text>
    <text x="1180" y="289" text-anchor="middle" fill="#607086" font-size="15">因果 Mask 阻止看到未来 token</text>

    <path d="M1180 306 L1180 420 L970 420" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M562 347 L650 347 L650 454 L762 454" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="782" y="392" width="188" height="124" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="876" y="432" text-anchor="middle" fill="#172033" font-size="22" font-weight="700">A · V</text>
    <text x="876" y="462" text-anchor="middle" fill="#607086" font-size="16">加权聚合</text>
    <text x="876" y="490" text-anchor="middle" fill="#607086" font-size="16">[n, d_v]</text>
    <line x1="970" y1="454" x2="1080" y2="454" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1100" y="402" width="230" height="104" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/>
    <text x="1215" y="442" text-anchor="middle" fill="#0B5E57" font-size="22" font-weight="700">输出 Y</text>
    <text x="1215" y="476" text-anchor="middle" fill="#356C67" font-size="17">上下文化表示</text>

    <rect x="72" y="570" width="1296" height="300" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="608" fill="#172033" font-size="21" font-weight="700">注意力矩阵 A 如何阅读</text>
    <text x="100" y="638" fill="#607086" font-size="16">行表示当前 Query，列表示被关注的 Key；颜色越深，聚合对应 Value 的权重越大。</text>

    <g transform="translate(160 680)">
      <text x="-22" y="34" text-anchor="end" fill="#607086" font-size="15">Q₁</text>
      <text x="-22" y="76" text-anchor="end" fill="#607086" font-size="15">Q₂</text>
      <text x="-22" y="118" text-anchor="end" fill="#607086" font-size="15">Q₃</text>
      <text x="-22" y="160" text-anchor="end" fill="#607086" font-size="15">Q₄</text>
      <text x="21" y="-12" text-anchor="middle" fill="#607086" font-size="15">K₁</text>
      <text x="63" y="-12" text-anchor="middle" fill="#607086" font-size="15">K₂</text>
      <text x="105" y="-12" text-anchor="middle" fill="#607086" font-size="15">K₃</text>
      <text x="147" y="-12" text-anchor="middle" fill="#607086" font-size="15">K₄</text>
      <rect x="0" y="0" width="42" height="42" fill="#DBEAFE" stroke="#FFFFFF"/>
      <rect x="42" y="0" width="42" height="42" fill="#93B4F5" stroke="#FFFFFF"/>
      <rect x="84" y="0" width="42" height="42" fill="#2563EB" stroke="#FFFFFF"/>
      <rect x="126" y="0" width="42" height="42" fill="#E8F0FF" stroke="#FFFFFF"/>
      <rect x="0" y="42" width="42" height="42" fill="#93B4F5" stroke="#FFFFFF"/>
      <rect x="42" y="42" width="42" height="42" fill="#DBEAFE" stroke="#FFFFFF"/>
      <rect x="84" y="42" width="42" height="42" fill="#E8F0FF" stroke="#FFFFFF"/>
      <rect x="126" y="42" width="42" height="42" fill="#2563EB" stroke="#FFFFFF"/>
      <rect x="0" y="84" width="42" height="42" fill="#E8F0FF" stroke="#FFFFFF"/>
      <rect x="42" y="84" width="42" height="42" fill="#2563EB" stroke="#FFFFFF"/>
      <rect x="84" y="84" width="42" height="42" fill="#93B4F5" stroke="#FFFFFF"/>
      <rect x="126" y="84" width="42" height="42" fill="#DBEAFE" stroke="#FFFFFF"/>
      <rect x="0" y="126" width="42" height="42" fill="#DBEAFE" stroke="#FFFFFF"/>
      <rect x="42" y="126" width="42" height="42" fill="#E8F0FF" stroke="#FFFFFF"/>
      <rect x="84" y="126" width="42" height="42" fill="#2563EB" stroke="#FFFFFF"/>
      <rect x="126" y="126" width="42" height="42" fill="#93B4F5" stroke="#FFFFFF"/>
    </g>

    <line x1="405" y1="754" x2="520" y2="754" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="564" y="698" fill="#153E85" font-size="18" font-weight="700">以第 3 行为例</text>
    <text x="564" y="734" fill="#526277" font-size="17">Q₃ 对 K₂、K₃ 权重更高</text>
    <text x="564" y="770" fill="#526277" font-size="17">输出 Y₃ 会更多聚合 V₂、V₃</text>
    <rect x="938" y="666" width="374" height="116" rx="8" fill="#FFF4DD" stroke="#E4B55B"/>
    <text x="1125" y="702" text-anchor="middle" fill="#7A4305" font-size="19" font-weight="700">复杂度从哪里来？</text>
    <text x="1125" y="736" text-anchor="middle" fill="#805B28" font-size="16">A 是 n × n 矩阵</text>
    <text x="1125" y="763" text-anchor="middle" fill="#805B28" font-size="16">序列变长时，计算与显存近似平方增长</text>
  </g>
</svg>
