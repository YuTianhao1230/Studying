<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Vision Transformer 从图像到分类结果</title>
  <desc id="desc">图像被切分为固定大小 patch，展平并线性投影为 token，加入分类 token 和位置编码后送入 Transformer Encoder。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#607086"/>
    </marker>
  </defs>

  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700">ViT：把二维图像改写成一串视觉 token</text>
    <text x="72" y="101" fill="#607086" font-size="18">核心变化不是“在图像上直接做 Attention”，而是先完成 Patch Tokenization。</text>

    <rect x="72" y="146" width="248" height="256" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="196" y="178" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">输入图像</text>
    <text x="196" y="204" text-anchor="middle" fill="#607086" font-size="15">H × W × C</text>
    <g transform="translate(106 224)">
      <rect width="180" height="144" rx="4" fill="#E8F0FF" stroke="#2563EB" stroke-width="2"/>
      <path d="M45 0 V144 M90 0 V144 M135 0 V144 M0 36 H180 M0 72 H180 M0 108 H180" stroke="#93B4F5" stroke-width="2"/>
      <rect x="45" y="36" width="45" height="36" fill="#2563EB" opacity="0.78"/>
      <text x="67.5" y="59" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">Patch</text>
    </g>

    <line x1="320" y1="274" x2="392" y2="274" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="356" y="250" text-anchor="middle" fill="#607086" font-size="14">切分</text>

    <rect x="412" y="146" width="248" height="256" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="536" y="178" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">Patch 序列</text>
    <text x="536" y="204" text-anchor="middle" fill="#607086" font-size="15">N = (H/P) × (W/P)</text>
    <g transform="translate(444 230)">
      <rect x="0" y="0" width="54" height="54" rx="5" fill="#DBEAFE" stroke="#93B4F5"/>
      <rect x="64" y="0" width="54" height="54" rx="5" fill="#CCFBF1" stroke="#7BC7B9"/>
      <rect x="128" y="0" width="54" height="54" rx="5" fill="#FEF3C7" stroke="#E4B55B"/>
      <rect x="32" y="66" width="54" height="54" rx="5" fill="#FFE4E6" stroke="#DB8DA5"/>
      <rect x="96" y="66" width="54" height="54" rx="5" fill="#EDE9FE" stroke="#B69AE8"/>
      <text x="27" y="34" text-anchor="middle" fill="#1D4ED8" font-size="15" font-weight="700">p₁</text>
      <text x="91" y="34" text-anchor="middle" fill="#0F766E" font-size="15" font-weight="700">p₂</text>
      <text x="155" y="34" text-anchor="middle" fill="#B45309" font-size="15" font-weight="700">p₃</text>
      <text x="59" y="100" text-anchor="middle" fill="#BE123C" font-size="15" font-weight="700">p₄</text>
      <text x="123" y="100" text-anchor="middle" fill="#6D28D9" font-size="15" font-weight="700">…</text>
    </g>
    <text x="536" y="378" text-anchor="middle" fill="#526277" font-size="15">每块大小 P × P × C</text>

    <line x1="660" y1="274" x2="732" y2="274" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="696" y="241" text-anchor="middle" fill="#607086" font-size="14">展平</text>
    <text x="696" y="261" text-anchor="middle" fill="#607086" font-size="14">线性投影</text>

    <rect x="752" y="146" width="264" height="256" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="884" y="178" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">构造 Token</text>
    <text x="884" y="204" text-anchor="middle" fill="#607086" font-size="15">[N + 1, d_model]</text>
    <g transform="translate(778 234)">
      <rect x="0" y="0" width="64" height="58" rx="6" fill="#172033"/>
      <rect x="72" y="0" width="52" height="58" rx="6" fill="#DBEAFE" stroke="#93B4F5"/>
      <rect x="132" y="0" width="52" height="58" rx="6" fill="#CCFBF1" stroke="#7BC7B9"/>
      <rect x="192" y="0" width="36" height="58" rx="6" fill="#EEF2F6" stroke="#AAB6C5"/>
      <text x="32" y="35" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">CLS</text>
      <text x="98" y="35" text-anchor="middle" fill="#1D4ED8" font-size="14" font-weight="700">z₁</text>
      <text x="158" y="35" text-anchor="middle" fill="#0F766E" font-size="14" font-weight="700">z₂</text>
      <text x="210" y="35" text-anchor="middle" fill="#526277" font-size="16">…</text>
    </g>
    <rect x="778" y="318" width="228" height="42" rx="6" fill="#F1EAFE" stroke="#B69AE8"/>
    <text x="892" y="345" text-anchor="middle" fill="#5720A3" font-size="15" font-weight="700">+ 可学习位置编码</text>
    <text x="884" y="384" text-anchor="middle" fill="#607086" font-size="14">CLS 用于汇聚整图信息</text>

    <line x1="1016" y1="274" x2="1088" y2="274" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1108" y="146" width="260" height="256" rx="8" fill="#F1EAFE" stroke="#B69AE8"/>
    <text x="1238" y="181" text-anchor="middle" fill="#5720A3" font-size="20" font-weight="700">Transformer Encoder × L</text>
    <rect x="1140" y="214" width="196" height="54" rx="7" fill="#FFFFFF" stroke="#B69AE8"/>
    <text x="1238" y="248" text-anchor="middle" fill="#5720A3" font-size="17" font-weight="700">LayerNorm + MSA</text>
    <rect x="1140" y="286" width="196" height="54" rx="7" fill="#FFFFFF" stroke="#B69AE8"/>
    <text x="1238" y="320" text-anchor="middle" fill="#5720A3" font-size="17" font-weight="700">LayerNorm + MLP</text>
    <text x="1238" y="374" text-anchor="middle" fill="#6A4B93" font-size="15">两处都有残差连接</text>

    <path d="M1238 402 L1238 472" fill="none" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1108" y="492" width="260" height="98" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/>
    <text x="1238" y="528" text-anchor="middle" fill="#0B5E57" font-size="20" font-weight="700">取 CLS 表示</text>
    <text x="1238" y="560" text-anchor="middle" fill="#356C67" font-size="16">MLP Head → 分类结果</text>

    <rect x="72" y="468" width="930" height="122" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="505" fill="#172033" font-size="20" font-weight="700">224 × 224 图像，Patch Size = 16</text>
    <text x="100" y="541" fill="#355986" font-size="18">每边 224 / 16 = 14 个 patch</text>
    <text x="476" y="541" fill="#0F766E" font-size="18">Patch Token：14 × 14 = 196</text>
    <text x="796" y="541" fill="#7A4305" font-size="18">加 CLS 后：197 个 token</text>
    <text x="100" y="572" fill="#607086" font-size="15">ViT-B/16 中的“16”就是 patch 边长，不是层数或 head 数。</text>

    <rect x="72" y="650" width="1296" height="180" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="690" fill="#172033" font-size="21" font-weight="700">Patch Size 为什么影响计算量</text>
    <rect x="100" y="718" width="356" height="76" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="278" y="747" text-anchor="middle" fill="#1D4ED8" font-size="17" font-weight="700">Patch 变小 / 分辨率提高</text>
    <text x="278" y="775" text-anchor="middle" fill="#355986" font-size="15">视觉 token 数增加</text>
    <line x1="456" y1="756" x2="536" y2="756" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="556" y="718" width="356" height="76" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
    <text x="734" y="747" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="700">Attention 矩阵变大</text>
    <text x="734" y="775" text-anchor="middle" fill="#356C67" font-size="15">大小约为 (N + 1)²</text>
    <line x1="912" y1="756" x2="992" y2="756" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1012" y="718" width="328" height="76" rx="8" fill="#FFF4DD" stroke="#E4B55B"/>
    <text x="1176" y="747" text-anchor="middle" fill="#B45309" font-size="17" font-weight="700">显存与计算快速上升</text>
    <text x="1176" y="775" text-anchor="middle" fill="#805B28" font-size="15">高分辨率需要专门优化</text>
  </g>
</svg>
