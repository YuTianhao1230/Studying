<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">联合图文攻击流程</title>
  <desc id="desc">联合攻击先优化图像特征和对齐损失，再进行视觉引导的离散文本替换。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">联合图文攻击：连续图像优化 + 离散文本替换，共同破坏跨模态互证</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">Syner-Attack 是两阶段流程：先优化对抗图像，再用视觉相关性引导文本候选替换。</text><rect x="72" y="154" width="616" height="500" rx="8" fill="#FFFFFF" stroke="#93B4F5"/><rect x="752" y="154" width="616" height="500" rx="8" fill="#FFFFFF" stroke="#B69AE8"/><text x="380" y="198" fill="#2563EB" font-size="22" font-weight="700" text-anchor="middle">阶段 1：图像侧连续优化</text><text x="1060" y="198" fill="#6D28D9" font-size="22" font-weight="700" text-anchor="middle">阶段 2：视觉引导文本替换</text><rect x="104" y="244" width="220" height="104" rx="8" fill="#E8F0FF" stroke="#93B4F5"/><text x="214.0" y="280" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">Clean Image</text><text x="214.0" y="310" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="214.0" dy="0">原始视觉语义</tspan></text><line x1="324" y1="296" x2="382" y2="296" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="390" y="226" width="266" height="140" rx="8" fill="#FFF4DD" stroke="#E4B55B"/><text x="523.0" y="262" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">Image Attack</text><text x="523.0" y="292" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="523.0" dy="0">L_feat：偏离视觉表征</tspan><tspan x="523.0" dy="22">L_align：削弱图文对齐</tspan></text><line x1="523" y1="366" x2="523" y2="424" stroke="#B45309" stroke-width="3" marker-end="url(#arrow-orange)"/><rect x="390" y="432" width="266" height="112" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/><text x="523.0" y="468" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">Adv Image</text><text x="523.0" y="498" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="523.0" dy="0">投影回图像预算 ε</tspan></text><rect x="784" y="244" width="220" height="104" rx="8" fill="#F1EAFE" stroke="#B69AE8"/><text x="894.0" y="280" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">Original Text</text><text x="894.0" y="310" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="894.0" dy="0">实体 / 属性 / 关系</tspan></text><line x1="1004" y1="296" x2="1062" y2="296" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="1070" y="226" width="266" height="140" rx="8" fill="#FFF4DD" stroke="#E4B55B"/><text x="1203.0" y="262" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">VGA Candidate Rank</text><text x="1203.0" y="292" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1203.0" dy="0">语义重要性</tspan><tspan x="1203.0" dy="22">与 Adv Image 的视觉相关性</tspan></text><line x1="1203" y1="366" x2="1203" y2="424" stroke="#B45309" stroke-width="3" marker-end="url(#arrow-orange)"/><rect x="1070" y="432" width="266" height="112" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/><text x="1203.0" y="468" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">Adversarial Text</text><text x="1203.0" y="498" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1203.0" dy="0">离散替换 + 语义保持过滤</tspan></text><path d="M656 488 C720 488 720 596 784 596" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M1070 488 C1000 488 1000 596 940 596" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="794" y="579" width="302" height="34" rx="6" fill="#FEE2E2"/><text x="945.0" y="602" fill="#B91C1C" font-size="14" font-weight="700" text-anchor="middle">联合输入破坏图文绑定关系</text><rect x="72" y="704" width="1296" height="140" rx="8" fill="#172033"/><text x="100" y="744" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="start">证明不是简单拼接：固定预算做消融</text><rect x="100" y="770" width="184" height="34" rx="6" fill="#27364A"/><text x="192.0" y="793" fill="#D7DFEA" font-size="14" font-weight="700" text-anchor="middle">Image-only</text><rect x="305" y="770" width="184" height="34" rx="6" fill="#27364A"/><text x="397.0" y="793" fill="#D7DFEA" font-size="14" font-weight="700" text-anchor="middle">Text-only</text><rect x="510" y="770" width="184" height="34" rx="6" fill="#27364A"/><text x="602.0" y="793" fill="#D7DFEA" font-size="14" font-weight="700" text-anchor="middle">仅双损失视觉攻击</text><rect x="715" y="770" width="184" height="34" rx="6" fill="#27364A"/><text x="807.0" y="793" fill="#D7DFEA" font-size="14" font-weight="700" text-anchor="middle">w/o alignment loss</text><rect x="920" y="770" width="184" height="34" rx="6" fill="#27364A"/><text x="1012.0" y="793" fill="#D7DFEA" font-size="14" font-weight="700" text-anchor="middle">w/o VGA</text><rect x="1125" y="770" width="184" height="34" rx="6" fill="#27364A"/><text x="1217.0" y="793" fill="#D7DFEA" font-size="14" font-weight="700" text-anchor="middle">完整两阶段</text><text x="720" y="827" fill="#D7DFEA" font-size="14" font-weight="400" text-anchor="middle">联合攻击拥有更大能力，必须分别报告图像范数、文本替换率、语义质量与目标任务 ASR。</text>
  </g>
</svg>
