<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">FGSM I-FGSM PGD 对比</title>
  <desc id="desc">展示 FGSM 单步、I-FGSM 多步投影和 PGD 随机起点多步投影的差别。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">FGSM、I-FGSM 与 PGD：一次大步、多次小步、随机起点多步搜索</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">三者必须在相同 ε 威胁模型下比较；投影保证每一步仍在允许扰动集合内。</text><rect x="72" y="160" width="416" height="554" rx="8" fill="#FFFFFF" stroke="#2563EB"/><text x="280" y="206" fill="#2563EB" font-size="24" font-weight="700" text-anchor="middle">FGSM</text><text x="280" y="236" fill="#607086" font-size="15" font-weight="400" text-anchor="middle">原图起点 · 单步</text><circle cx="280" cy="436" r="146" fill="#E8F0FF" stroke="#2563EB" stroke-width="3" stroke-dasharray="9 7"/><text x="280" y="628" fill="#607086" font-size="15" font-weight="700" text-anchor="middle">L∞ 扰动球 B(x, ε)</text><rect x="512" y="160" width="416" height="554" rx="8" fill="#FFFFFF" stroke="#6D28D9"/><text x="720" y="206" fill="#6D28D9" font-size="24" font-weight="700" text-anchor="middle">I-FGSM / BIM</text><text x="720" y="236" fill="#607086" font-size="15" font-weight="400" text-anchor="middle">原图起点 · 多步投影</text><circle cx="720" cy="436" r="146" fill="#F1EAFE" stroke="#6D28D9" stroke-width="3" stroke-dasharray="9 7"/><text x="720" y="628" fill="#607086" font-size="15" font-weight="700" text-anchor="middle">L∞ 扰动球 B(x, ε)</text><rect x="952" y="160" width="416" height="554" rx="8" fill="#FFFFFF" stroke="#0F766E"/><text x="1160" y="206" fill="#0F766E" font-size="24" font-weight="700" text-anchor="middle">PGD</text><text x="1160" y="236" fill="#607086" font-size="15" font-weight="400" text-anchor="middle">随机起点 · 多步投影 / 重启</text><circle cx="1160" cy="436" r="146" fill="#E7F8F4" stroke="#0F766E" stroke-width="3" stroke-dasharray="9 7"/><text x="1160" y="628" fill="#607086" font-size="15" font-weight="700" text-anchor="middle">L∞ 扰动球 B(x, ε)</text><circle cx="190" cy="470" r="13" fill="#172033"/><text x="190" y="503" fill="#172033" font-size="16" font-weight="700" text-anchor="middle">x</text><line x1="205" y1="462" x2="350" y2="350" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow-blue)"/><circle cx="363" cy="340" r="13" fill="#2563EB"/><text x="280" y="318" fill="#2563EB" font-size="15" font-weight="700" text-anchor="middle">一次用完 ε</text><polyline points="625,470 660,442 702,423 742,385 780,356" fill="none" stroke="#6D28D9" stroke-width="4" marker-end="url(#arrow-purple)"/><circle cx="625" cy="470" r="9" fill="#6D28D9"/><circle cx="660" cy="442" r="9" fill="#6D28D9"/><circle cx="702" cy="423" r="9" fill="#6D28D9"/><circle cx="742" cy="385" r="9" fill="#6D28D9"/><circle cx="780" cy="356" r="9" fill="#6D28D9"/><text x="720" y="318" fill="#6D28D9" font-size="15" font-weight="700" text-anchor="middle">每步 α + 投影</text><circle cx="1080" cy="500" r="12" fill="#607086"/><text x="1080" y="532" fill="#607086" font-size="15" font-weight="700" text-anchor="middle">随机起点</text><polyline points="1080,500 1115,465 1165,438 1206,394 1245,365" fill="none" stroke="#0F766E" stroke-width="4" marker-end="url(#arrow-teal)"/><circle cx="1115" cy="465" r="9" fill="#0F766E"/><circle cx="1165" cy="438" r="9" fill="#0F766E"/><circle cx="1206" cy="394" r="9" fill="#0F766E"/><circle cx="1245" cy="365" r="9" fill="#0F766E"/><text x="1160" y="318" fill="#0F766E" font-size="15" font-weight="700" text-anchor="middle">随机初始化减少起点偏差</text><rect x="72" y="756" width="1296" height="88" rx="8" fill="#172033"/><text x="100" y="792" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="start">用途</text><text x="220" y="792" fill="#D7DFEA" font-size="15" font-weight="700" text-anchor="start">FGSM：快速筛查</text><text x="500" y="792" fill="#D7DFEA" font-size="15" font-weight="700" text-anchor="start">I-FGSM：更强白盒局部搜索</text><text x="860" y="792" fill="#D7DFEA" font-size="15" font-weight="700" text-anchor="start">PGD：强一阶白盒基线 / 对抗训练内层最大化</text><text x="720" y="823" fill="#D7DFEA" font-size="14" font-weight="400" text-anchor="middle">模型扛住单个 PGD 配置不等于真实鲁棒，还要检查步长、重启、自适应攻击与 Gradient Masking。</text>
  </g>
</svg>
