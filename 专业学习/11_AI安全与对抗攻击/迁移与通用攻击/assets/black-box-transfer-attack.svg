<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">黑盒迁移攻击链路</title>
  <desc id="desc">对抗样本在可访问源模型上生成，再迁移到不可见目标模型进行评估。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">黑盒迁移攻击：在可访问源模型上优化，在不可见目标模型上只做评估</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">目标模型不提供梯度；若用目标返回继续调参，就已从零查询迁移变成查询型黑盒。</text><rect x="72" y="230" width="260" height="188" rx="8" fill="#E8F0FF" stroke="#93B4F5"/><text x="202.0" y="266" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">干净输入 x</text><text x="202.0" y="296" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="202.0" dy="0">人类语义保持</tspan><tspan x="202.0" dy="22">约束 ‖δ‖ ≤ ε</tspan></text><line x1="332" y1="324" x2="402" y2="324" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="410" y="190" width="330" height="268" rx="8" fill="#F1EAFE" stroke="#B69AE8"/><text x="575.0" y="226" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">Surrogate 源模型</text><text x="575.0" y="256" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="575.0" dy="0">可访问参数与梯度</tspan><tspan x="575.0" dy="22">优化 δ：动量 / DIM / TIM</tspan><tspan x="575.0" dy="22">可集成多源模型</tspan><tspan x="575.0" dy="22">可攻击中间特征</tspan></text><line x1="740" y1="324" x2="820" y2="324" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><rect x="828" y="230" width="260" height="188" rx="8" fill="#FFF4DD" stroke="#E4B55B"/><text x="958.0" y="266" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">对抗输入 x + δ</text><text x="958.0" y="296" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="958.0" dy="0">冻结后直接迁移</tspan><tspan x="958.0" dy="22">不再看源模型</tspan></text><rect x="1155" y="166" width="213" height="102" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/><text x="1261.5" y="202" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">目标模型 A</text><text x="1261.5" y="232" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1261.5" dy="0">CNN / ViT</tspan></text><path d="M1088 324 C1125 324 1120 217 1147 217" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="1155" y="304" width="213" height="102" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/><text x="1261.5" y="340" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">目标模型 B</text><text x="1261.5" y="370" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1261.5" dy="0">VLM / MLLM</tspan></text><path d="M1088 324 C1125 324 1120 355 1147 355" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="1155" y="442" width="213" height="102" rx="8" fill="#E7F8F4" stroke="#7BC7B9"/><text x="1261.5" y="478" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">目标系统 C</text><text x="1261.5" y="508" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1261.5" dy="0">商业黑盒 API</tspan></text><path d="M1088 324 C1125 324 1120 493 1147 493" fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="72" y="540" width="1016" height="206" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="100" y="580" fill="#172033" font-size="20" font-weight="700" text-anchor="start">可信迁移证据</text><text x="104" y="610" fill="#2563EB" font-size="15" font-weight="700" text-anchor="start">Hold-out</text><text x="214" y="610" fill="#607086" font-size="14" font-weight="400" text-anchor="start">目标模型不参与梯度、超参选择与早停</text><text x="104" y="641" fill="#6D28D9" font-size="15" font-weight="700" text-anchor="start">统一预算</text><text x="214" y="641" fill="#607086" font-size="14" font-weight="400" text-anchor="start">相同 ε、步数、预处理与样本过滤</text><text x="104" y="672" fill="#0F766E" font-size="15" font-weight="700" text-anchor="start">任务指标</text><text x="214" y="672" fill="#607086" font-size="14" font-weight="400" text-anchor="start">目标端 Transfer ASR / accuracy / Recall 变化</text><text x="104" y="703" fill="#B45309" font-size="15" font-weight="700" text-anchor="start">边界</text><text x="214" y="703" fill="#607086" font-size="14" font-weight="400" text-anchor="start">异构架构失败时如实报告迁移范围</text><rect x="1120" y="606" width="248" height="140" rx="8" fill="#FEE2E2" stroke="#F2A7A7"/><text x="1244" y="643" fill="#B91C1C" font-size="18" font-weight="700" text-anchor="middle">不能混淆</text><text x="1244" y="678" fill="#B91C1C" font-size="15" font-weight="700" text-anchor="middle"><tspan x="1244" dy="0">源模型白盒成功</tspan><tspan x="1244" dy="28">≠ 目标模型迁移成功</tspan></text><text x="720" y="830" fill="#607086" font-size="16" font-weight="400" text-anchor="middle">迁移性来自共享数据、架构归纳偏置、特征或对齐空间，但不是理论保证。</text>
  </g>
</svg>
