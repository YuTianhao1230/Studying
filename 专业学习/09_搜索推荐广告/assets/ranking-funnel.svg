<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">排序分层漏斗</title>
  <desc id="desc">召回、粗排、精排和重排逐层缩小候选并增加单候选计算预算。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">召回 → 粗排 → 精排 → 重排：候选越少，单候选计算越深</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">分层本质是预算分配；任何上游误杀都无法被后续强模型补回。</text><rect x="110" y="174" width="1220" height="110" rx="8" fill="#E8F0FF" stroke="#2563EB"/><text x="138" y="212" fill="#2563EB" font-size="22" font-weight="700" text-anchor="start">全量库 → 召回</text><text x="1302" y="212" fill="#2563EB" font-size="17" font-weight="700" text-anchor="end">百万 / 亿级 → 10³</text><text x="720.0" y="252" fill="#607086" font-size="15" font-weight="400" text-anchor="middle">高 Recall、低延迟；BM25 / 双塔 ANN / 多路召回</text><rect x="230" y="304" width="980" height="110" rx="8" fill="#F1EAFE" stroke="#6D28D9"/><text x="258" y="342" fill="#6D28D9" font-size="22" font-weight="700" text-anchor="start">粗排</text><text x="1182" y="342" fill="#6D28D9" font-size="17" font-weight="700" text-anchor="end">10³ → 10²</text><text x="720.0" y="382" fill="#607086" font-size="15" font-weight="400" text-anchor="middle">轻量特征快速压缩，同时保护精排正例</text><rect x="350" y="434" width="740" height="110" rx="8" fill="#FFF4DD" stroke="#B45309"/><text x="378" y="472" fill="#B45309" font-size="22" font-weight="700" text-anchor="start">精排</text><text x="1062" y="472" fill="#B45309" font-size="17" font-weight="700" text-anchor="end">10² → Top-K</text><text x="720.0" y="512" fill="#607086" font-size="15" font-weight="400" text-anchor="middle">Cross-Encoder / LTR / 深模型，追求顺序准确</text><rect x="470" y="564" width="500" height="110" rx="8" fill="#E7F8F4" stroke="#0F766E"/><text x="498" y="602" fill="#0F766E" font-size="22" font-weight="700" text-anchor="start">重排</text><text x="942" y="602" fill="#0F766E" font-size="17" font-weight="700" text-anchor="end">Top-K → 最终列表</text><text x="720.0" y="642" fill="#607086" font-size="15" font-weight="400" text-anchor="middle">去重、多样性、安全、配额与 token 预算</text><path d="M1340 215 C1380 360 1380 540 1010 620" fill="none" stroke="#B91C1C" stroke-width="3" marker-end="url(#arrow-red)"/><text x="1344" y="410" fill="#B91C1C" font-size="16" font-weight="700" text-anchor="end">单候选成本 ↑</text><path d="M90 620 C48 470 48 290 92 220" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="96" y="410" fill="#2563EB" font-size="16" font-weight="700" text-anchor="start">候选规模 ↑</text><rect x="72" y="726" width="1296" height="118" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="100" y="764" fill="#172033" font-size="18" font-weight="700" text-anchor="start">阶段指标必须匹配职责</text><text x="100" y="808" fill="#2563EB" font-size="15" font-weight="700" text-anchor="start">召回</text><text x="162" y="808" fill="#607086" font-size="14" font-weight="400" text-anchor="start">Recall@K / 覆盖率</text><text x="410" y="808" fill="#6D28D9" font-size="15" font-weight="700" text-anchor="start">粗排</text><text x="472" y="808" fill="#607086" font-size="14" font-weight="400" text-anchor="start">正例保留率 / 压缩率</text><text x="720" y="808" fill="#B45309" font-size="15" font-weight="700" text-anchor="start">精排</text><text x="782" y="808" fill="#607086" font-size="14" font-weight="400" text-anchor="start">NDCG / MRR / AUC</text><text x="1030" y="808" fill="#0F766E" font-size="15" font-weight="700" text-anchor="start">重排</text><text x="1092" y="808" fill="#607086" font-size="14" font-weight="400" text-anchor="start">约束违规 / 多样性 / 可用性</text>
  </g>
</svg>
