<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">A/B 测试决策门禁</title>
  <desc id="desc">A/B 测试从假设、分桶、数据检查、指标与统计分析进入最终业务决策。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">A/B 测试：先证明实验可信，再解释指标，最后决定是否放量</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">统计显著只是一个门槛；效果量、护栏、长期影响与回滚风险共同决定结论。</text><rect x="72" y="174" width="184" height="92" rx="8" fill="#E8F0FF" stroke="#2563EB"/><text x="164.0" y="227.0" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">假设与 MDE</text><line x1="256" y1="220" x2="280" y2="220" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="288" y="174" width="184" height="92" rx="8" fill="#F1EAFE" stroke="#6D28D9"/><text x="380.0" y="227.0" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">随机分桶</text><line x1="472" y1="220" x2="496" y2="220" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="504" y="174" width="184" height="92" rx="8" fill="#E7F8F4" stroke="#0F766E"/><text x="596.0" y="227.0" fill="#0F766E" font-size="19" font-weight="700" text-anchor="middle">SRM / 埋点检查</text><line x1="688" y1="220" x2="712" y2="220" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="720" y="174" width="184" height="92" rx="8" fill="#FFF4DD" stroke="#B45309"/><text x="812.0" y="227.0" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">主指标 + 护栏</text><line x1="904" y1="220" x2="928" y2="220" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="936" y="174" width="184" height="92" rx="8" fill="#ECFDF3" stroke="#15803D"/><text x="1028.0" y="227.0" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">区间与 p-value</text><line x1="1120" y1="220" x2="1144" y2="220" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="1152" y="174" width="184" height="92" rx="8" fill="#FEE2E2" stroke="#B91C1C"/><text x="1244.0" y="227.0" fill="#B91C1C" font-size="19" font-weight="700" text-anchor="middle">业务决策</text><rect x="72" y="324" width="630" height="414" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="100" y="366" fill="#172033" font-size="21" font-weight="700" text-anchor="start">四道可信性门禁</text><rect x="100" y="398" width="104" height="34" rx="6" fill="#E8F0FF"/><text x="152.0" y="421" fill="#2563EB" font-size="14" font-weight="700" text-anchor="middle">1 数据</text><text x="226" y="421" fill="#607086" font-size="14" font-weight="400" text-anchor="start">埋点完整、分桶比例正常、无样本污染</text><rect x="100" y="474" width="104" height="34" rx="6" fill="#F1EAFE"/><text x="152.0" y="497" fill="#6D28D9" font-size="14" font-weight="700" text-anchor="middle">2 设计</text><text x="226" y="497" fill="#607086" font-size="14" font-weight="400" text-anchor="start">随机化单位、样本量、周期、停止规则预注册</text><rect x="100" y="550" width="104" height="34" rx="6" fill="#E7F8F4"/><text x="152.0" y="573" fill="#0F766E" font-size="14" font-weight="700" text-anchor="middle">3 统计</text><text x="226" y="573" fill="#607086" font-size="14" font-weight="400" text-anchor="start">绝对/相对变化、置信区间、p-value、功效</text><rect x="100" y="626" width="104" height="34" rx="6" fill="#FFF4DD"/><text x="152.0" y="649" fill="#B45309" font-size="14" font-weight="700" text-anchor="middle">4 业务</text><text x="226" y="649" fill="#607086" font-size="14" font-weight="400" text-anchor="start">达到最小收益，且延迟、成本、负反馈不恶化</text><rect x="738" y="324" width="630" height="414" rx="8" fill="#172033"/><text x="766" y="366" fill="#FFFFFF" font-size="21" font-weight="700" text-anchor="start">结果如何落地</text><rect x="766" y="396" width="210" height="34" rx="6" fill="#ECFDF3"/><text x="871.0" y="419" fill="#15803D" font-size="14" font-weight="700" text-anchor="middle">可信且收益达标</text><text x="1004" y="419" fill="#D7DFEA" font-size="15" font-weight="700" text-anchor="start">逐步放量</text><rect x="766" y="458" width="210" height="34" rx="6" fill="#FFF4DD"/><text x="871.0" y="481" fill="#B45309" font-size="14" font-weight="700" text-anchor="middle">显著但收益过小</text><text x="1004" y="481" fill="#D7DFEA" font-size="15" font-weight="700" text-anchor="start">不放量或继续优化</text><rect x="766" y="520" width="210" height="34" rx="6" fill="#FEE2E2"/><text x="871.0" y="543" fill="#B91C1C" font-size="14" font-weight="700" text-anchor="middle">主指标涨、护栏跌</text><text x="1004" y="543" fill="#D7DFEA" font-size="15" font-weight="700" text-anchor="start">回滚 / 收窄人群</text><rect x="766" y="582" width="210" height="34" rx="6" fill="#F1EAFE"/><text x="871.0" y="605" fill="#6D28D9" font-size="14" font-weight="700" text-anchor="middle">不显著且功效不足</text><text x="1004" y="605" fill="#D7DFEA" font-size="15" font-weight="700" text-anchor="start">延长实验，不下结论</text><rect x="766" y="644" width="210" height="34" rx="6" fill="#E8F0FF"/><text x="871.0" y="667" fill="#2563EB" font-size="14" font-weight="700" text-anchor="middle">SRM / 埋点异常</text><text x="1004" y="667" fill="#D7DFEA" font-size="15" font-weight="700" text-anchor="start">实验无效，先修数据</text><text x="720" y="812" fill="#607086" font-size="17" font-weight="400" text-anchor="middle">离线指标上涨只能作为上线候选证据，不能替代用户级随机实验。</text>
  </g>
</svg>
