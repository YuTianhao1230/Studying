<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">后训练组件关系与 Reference Model 作用</title>
  <desc id="desc">展示 Policy Model、Reward Model、Verifier、Critic 和 Reference Model 在后训练中的关系，并解释 Reference Model 通过 KL 散度约束当前策略不要偏离原始模型过远。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52606d"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#0a9f58"/>
    </marker>
    <style>
      .title { font: 600 28px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .subtitle { font: 400 16px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .section-title { font: 600 20px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .heading { font: 600 18px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #17212b; }
      .focus-heading { font: 600 18px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #00552c; }
      .body { font: 400 15px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .small { font: 500 14px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #52606d; }
      .formula { font: 600 16px "JetBrains Mono", "PingFang SC", monospace; fill: #17212b; }
      .badge-text { font: 600 13px "PingFang SC", "Microsoft YaHei", sans-serif; fill: #00552c; }
      .boundary { fill: #f7f8fa; stroke: #cdd5df; stroke-width: 2; stroke-dasharray: 8 7; }
      .node { fill: #ffffff; stroke: #cdd5df; stroke-width: 2; }
      .policy { fill: #ffffff; stroke: #20b7a5; stroke-width: 2.5; }
      .focus { fill: #e7fff3; stroke: #0fbd6c; stroke-width: 2.5; }
      .formula-box { fill: #f2f4f7; stroke: #cdd5df; stroke-width: 1.5; }
      .badge { fill: #b7f6d7; stroke: #0fbd6c; stroke-width: 1.5; }
      .chip { fill: #ffffff; stroke: #cdd5df; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #52606d; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .main-arrow { fill: none; stroke: #0a9f58; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .guide { fill: none; stroke: #cdd5df; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect width="1200" height="860" fill="#ffffff"/>
  <text class="title" x="45" y="48">后训练组件关系与 Reference Model 作用</text>
  <text class="subtitle" x="45" y="78">核心：Reward / Verifier 负责打分，Critic 负责估值，Reference Model 负责限制策略漂移</text>

  <rect class="boundary" x="40" y="102" width="1120" height="388" rx="18"/>
  <text class="section-title" x="68" y="136">一、完整后训练关系</text>

  <rect class="policy" x="450" y="155" width="300" height="78" rx="12"/>
  <text class="heading" x="600" y="185" text-anchor="middle">Policy Model（当前策略）</text>
  <text class="body" x="600" y="211" text-anchor="middle">接收 Prompt，生成 Response；训练时被更新</text>

  <path class="arrow" d="M500 233 C455 255 245 250 180 280"/>
  <path class="arrow" d="M565 233 C540 255 485 255 460 280"/>
  <path class="arrow" d="M635 233 C660 255 715 255 740 280"/>
  <path class="main-arrow" d="M700 233 C745 255 955 250 1020 280"/>
  <rect class="formula-box" x="519" y="242" width="162" height="28" rx="8"/>
  <text class="small" x="600" y="261" text-anchor="middle">同一批生成样本</text>

  <rect class="node" x="65" y="280" width="230" height="82" rx="12"/>
  <text class="heading" x="180" y="311" text-anchor="middle">Reward Model</text>
  <text class="body" x="180" y="338" text-anchor="middle">学习人类偏好，输出奖励</text>

  <rect class="node" x="345" y="280" width="230" height="82" rx="12"/>
  <text class="heading" x="460" y="311" text-anchor="middle">Verifier</text>
  <text class="body" x="460" y="338" text-anchor="middle">检查答案、格式与规则</text>

  <rect class="node" x="625" y="280" width="230" height="82" rx="12"/>
  <text class="heading" x="740" y="311" text-anchor="middle">Critic</text>
  <text class="body" x="740" y="338" text-anchor="middle">预测当前状态的未来回报</text>

  <rect class="focus" x="905" y="280" width="230" height="82" rx="12"/>
  <text class="focus-heading" x="1020" y="311" text-anchor="middle">Reference Model</text>
  <text class="body" x="1020" y="338" text-anchor="middle">冻结旧策略，计算 KL 约束</text>
  <rect class="badge" x="1061" y="289" width="60" height="24" rx="12"/>
  <text class="badge-text" x="1091" y="306" text-anchor="middle">冻结</text>

  <rect class="policy" x="390" y="408" width="420" height="58" rx="12"/>
  <text class="heading" x="600" y="434" text-anchor="middle">训练目标 / 优势估计</text>
  <text class="body" x="600" y="456" text-anchor="middle">综合奖励、价值基线与 KL 惩罚，反向更新 Policy</text>

  <path class="arrow" d="M180 362 V386 H460 V408"/>
  <path class="arrow" d="M460 362 V408"/>
  <path class="arrow" d="M740 362 V386 H690 V408"/>
  <path class="main-arrow" d="M1020 362 V386 H780 V408"/>
  <text class="small" x="285" y="383" text-anchor="middle">奖励分</text>
  <text class="small" x="476" y="389">验证分</text>
  <text class="small" x="742" y="383">价值基线</text>
  <text class="small" x="891" y="383" text-anchor="middle">KL 惩罚</text>

  <rect class="boundary" x="40" y="520" width="1120" height="300" rx="18"/>
  <text class="section-title" x="68" y="554">二、Reference Model 到底约束什么？</text>
  <text class="subtitle" x="68" y="582">约束的是当前 Policy 与原始 SFT 模型的输出概率分布差异，不是要求两个模型生成完全相同的文本。</text>

  <rect class="policy" x="70" y="615" width="280" height="70" rx="12"/>
  <text class="heading" x="210" y="644" text-anchor="middle">当前 Policy：πθ(y|x)</text>
  <text class="body" x="210" y="670" text-anchor="middle">正在训练，参数持续变化</text>

  <rect class="focus" x="70" y="716" width="280" height="70" rx="12"/>
  <text class="focus-heading" x="210" y="745" text-anchor="middle">Reference：πref(y|x)</text>
  <text class="body" x="210" y="771" text-anchor="middle">SFT 副本，参数始终冻结</text>

  <rect class="formula-box" x="435" y="660" width="270" height="82" rx="12"/>
  <text class="heading" x="570" y="689" text-anchor="middle">计算分布距离</text>
  <text class="formula" x="570" y="719" text-anchor="middle">D_KL(πθ || πref)</text>

  <path class="arrow" d="M350 650 C395 650 395 681 435 681"/>
  <path class="main-arrow" d="M350 751 C395 751 395 721 435 721"/>

  <rect class="focus" x="790" y="627" width="330" height="112" rx="12"/>
  <text class="focus-heading" x="955" y="658" text-anchor="middle">加入训练目标</text>
  <text class="formula" x="955" y="688" text-anchor="middle">r_total = r_task - β · KL</text>
  <text class="body" x="955" y="716" text-anchor="middle">偏离越大，惩罚越强；β 控制约束力度</text>
  <path class="main-arrow" d="M705 701 H790"/>

  <path class="guide" d="M955 739 V760"/>
  <rect class="chip" x="748" y="760" width="130" height="38" rx="9"/>
  <rect class="chip" x="890" y="760" width="130" height="38" rx="9"/>
  <rect class="chip" x="1032" y="760" width="100" height="38" rx="9"/>
  <text class="small" x="813" y="784" text-anchor="middle">防止奖励投机</text>
  <text class="small" x="955" y="784" text-anchor="middle">保留语言能力</text>
  <text class="small" x="1082" y="784" text-anchor="middle">稳定训练</text>
</svg>
