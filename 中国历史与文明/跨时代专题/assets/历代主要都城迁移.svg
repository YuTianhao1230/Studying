<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540">
  <rect width="1000" height="540" fill="#f7f5ef"/>
  <text x="50" y="52" font-family="sans-serif" font-size="28" fill="#222">历代主要都城迁移示意</text>
  <text x="50" y="82" font-family="sans-serif" font-size="15" fill="#666">节点关系示意，不表示精确疆域与比例距离</text>
  <g stroke="#b8b2a7" stroke-width="3" fill="none">
    <path d="M110 270 H880"/>
    <path d="M205 270 Q300 155 395 270"/>
    <path d="M395 270 Q500 400 605 270"/>
    <path d="M605 270 Q705 155 805 270"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="#9e3d2f"><circle cx="110" cy="270" r="11"/><text x="110" y="235" font-size="18" fill="#222">丰镐／咸阳／长安</text><text x="110" y="305" font-size="14" fill="#666">周秦汉唐</text></g>
    <g fill="#b8781d"><circle cx="300" cy="155" r="11"/><text x="300" y="125" font-size="18" fill="#222">洛阳</text><text x="300" y="185" font-size="14" fill="#666">东周、东汉、魏晋、北魏</text></g>
    <g fill="#33735b"><circle cx="395" cy="270" r="11"/><text x="395" y="235" font-size="18" fill="#222">开封</text><text x="395" y="305" font-size="14" fill="#666">北宋</text></g>
    <g fill="#33735b"><circle cx="500" cy="400" r="11"/><text x="500" y="438" font-size="18" fill="#222">南京／杭州</text><text x="500" y="468" font-size="14" fill="#666">六朝、南宋、明初</text></g>
    <g fill="#365d91"><circle cx="605" cy="270" r="11"/><text x="605" y="235" font-size="18" fill="#222">大都／北京</text><text x="605" y="305" font-size="14" fill="#666">元明清</text></g>
    <g fill="#704a8f"><circle cx="805" cy="155" r="11"/><text x="805" y="125" font-size="18" fill="#222">近现代政治中心</text><text x="805" y="185" font-size="14" fill="#666">南京与北京先后变化</text></g>
  </g>
  <text x="50" y="510" font-family="sans-serif" font-size="14" fill="#666">迁都受军事安全、交通粮运、区域控制与政治重组共同影响。</text>
</svg>
