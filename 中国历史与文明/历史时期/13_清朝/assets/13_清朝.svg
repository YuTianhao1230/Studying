<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="570" viewBox="0 0 1700 570"><rect width="100%" height="100%" fill="#f6f3ed"/><g font-family="Droid Sans Fallback,DejaVu Sans,sans-serif">
<text x="45" y="70" font-size="32" fill="#182d3d">清朝关键节点</text>
<text x="45" y="115" font-size="21" fill="#526473">横轴按首个标注年份定位；并列日期在同一节点说明。公元纪年无0年。</text>
<path d="M100 290H1600" stroke="#849893" stroke-width="4"/>
<path d="M100.0 290L135.0 215" stroke="#b7b2a7" stroke-width="2"/><circle cx="100.0" cy="290" r="7" fill="#9d5e3e"/><text x="55.0" y="173" font-size="21" fill="#9d5e3e">1616／1636年</text>
<text x="55.0" y="207" font-size="22" fill="#182d3d">后金建立／改国号清</text>
<path d="M242.4 290L430.0 345" stroke="#b7b2a7" stroke-width="2"/><circle cx="242.4" cy="290" r="7" fill="#9d5e3e"/><text x="350.0" y="378" font-size="21" fill="#9d5e3e">1644年</text>
<text x="350.0" y="412" font-size="22" fill="#182d3d">清军入关</text>
<path d="M328.8 290L800.0 215" stroke="#b7b2a7" stroke-width="2"/><circle cx="328.8" cy="290" r="7" fill="#9d5e3e"/><text x="720.0" y="173" font-size="21" fill="#9d5e3e">1661—1796年</text>
<text x="720.0" y="207" font-size="22" fill="#182d3d">康熙、雍正、乾隆三朝</text>
<path d="M1239.0 290L1170.0 345" stroke="#b7b2a7" stroke-width="2"/><circle cx="1239.0" cy="290" r="7" fill="#9d5e3e"/><text x="1090.0" y="378" font-size="21" fill="#9d5e3e">1840—1842年</text>
<text x="1090.0" y="412" font-size="22" fill="#182d3d">第一次鸦片战争</text>
<path d="M1600.0 290L1480.0 215" stroke="#b7b2a7" stroke-width="2"/><circle cx="1600.0" cy="290" r="7" fill="#9d5e3e"/><text x="1400.0" y="173" font-size="21" fill="#9d5e3e">1911／1912年</text>
<text x="1400.0" y="207" font-size="22" fill="#182d3d">辛亥革命／清帝退位</text>
</g></svg>