<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="570" viewBox="0 0 1700 570"><rect width="100%" height="100%" fill="#f6f3ed"/><g font-family="Droid Sans Fallback,DejaVu Sans,sans-serif">
<text x="45" y="70" font-size="32" fill="#182d3d">五代十国与辽宋夏金关键节点</text>
<text x="45" y="115" font-size="21" fill="#526473">横轴按首个标注年份定位；并列日期在同一节点说明。公元纪年无0年。</text>
<path d="M100 290H1600" stroke="#849893" stroke-width="4"/>
<path d="M100.0 290L135.0 215" stroke="#b7b2a7" stroke-width="2"/><circle cx="100.0" cy="290" r="7" fill="#9d5e3e"/><text x="55.0" y="173" font-size="21" fill="#9d5e3e">907年</text>
<text x="55.0" y="207" font-size="22" fill="#182d3d">五代十国时期开始</text>
<path d="M136.6 290L430.0 345" stroke="#b7b2a7" stroke-width="2"/><circle cx="136.6" cy="290" r="7" fill="#9d5e3e"/><text x="350.0" y="378" font-size="21" fill="#9d5e3e">916／960年</text>
<text x="350.0" y="412" font-size="22" fill="#182d3d">辽建立／北宋建立</text>
<path d="M498.4 290L800.0 215" stroke="#b7b2a7" stroke-width="2"/><circle cx="498.4" cy="290" r="7" fill="#9d5e3e"/><text x="720.0" y="173" font-size="21" fill="#9d5e3e">1005／1038年</text>
<text x="720.0" y="207" font-size="22" fill="#182d3d">澶渊之盟／西夏称帝</text>
<path d="M945.5 290L1170.0 345" stroke="#b7b2a7" stroke-width="2"/><circle cx="945.5" cy="290" r="7" fill="#9d5e3e"/><text x="1090.0" y="378" font-size="21" fill="#9d5e3e">1115／1127年</text>
<text x="1090.0" y="412" font-size="22" fill="#182d3d">金建立／靖康之变与南宋</text>
<text x="1090.0" y="440" font-size="22" fill="#182d3d">开始</text>
<path d="M1600.0 290L1480.0 215" stroke="#b7b2a7" stroke-width="2"/><circle cx="1600.0" cy="290" r="7" fill="#9d5e3e"/><text x="1400.0" y="173" font-size="21" fill="#9d5e3e">1276／1279年</text>
<text x="1400.0" y="207" font-size="22" fill="#182d3d">临安投降／崖山之战，南</text>
<text x="1400.0" y="235" font-size="22" fill="#182d3d">宋终结</text>
</g></svg>