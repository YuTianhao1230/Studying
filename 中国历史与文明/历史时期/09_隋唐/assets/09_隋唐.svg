<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="570" viewBox="0 0 1700 570"><rect width="100%" height="100%" fill="#f6f3ed"/><g font-family="Droid Sans Fallback,DejaVu Sans,sans-serif">
<text x="45" y="70" font-size="32" fill="#182d3d">隋唐关键节点</text>
<text x="45" y="115" font-size="21" fill="#526473">横轴按首个标注年份定位；并列日期在同一节点说明。公元纪年无0年。</text>
<path d="M100 290H1600" stroke="#849893" stroke-width="4"/>
<path d="M100.0 290L135.0 215" stroke="#b7b2a7" stroke-width="2"/><circle cx="100.0" cy="290" r="7" fill="#9d5e3e"/><text x="55.0" y="173" font-size="21" fill="#9d5e3e">581／589年</text>
<text x="55.0" y="207" font-size="22" fill="#182d3d">隋建立／灭陈统一</text>
<path d="M306.9 290L430.0 345" stroke="#b7b2a7" stroke-width="2"/><circle cx="306.9" cy="290" r="7" fill="#9d5e3e"/><text x="350.0" y="378" font-size="21" fill="#9d5e3e">605年起</text>
<text x="350.0" y="412" font-size="22" fill="#182d3d">隋大运河重要工程阶段</text>
<path d="M419.0 290L800.0 215" stroke="#b7b2a7" stroke-width="2"/><circle cx="419.0" cy="290" r="7" fill="#9d5e3e"/><text x="720.0" y="173" font-size="21" fill="#9d5e3e">618／626年</text>
<text x="720.0" y="207" font-size="22" fill="#182d3d">唐建立／玄武门之变</text>
<path d="M1039.7 290L1170.0 345" stroke="#b7b2a7" stroke-width="2"/><circle cx="1039.7" cy="290" r="7" fill="#9d5e3e"/><text x="1090.0" y="378" font-size="21" fill="#9d5e3e">690—705年</text>
<text x="1090.0" y="412" font-size="22" fill="#182d3d">武周</text>
<path d="M1600.0 290L1480.0 215" stroke="#b7b2a7" stroke-width="2"/><circle cx="1600.0" cy="290" r="7" fill="#9d5e3e"/><text x="1400.0" y="173" font-size="21" fill="#9d5e3e">755—763／907年</text>
<text x="1400.0" y="207" font-size="22" fill="#182d3d">安史之乱／唐亡</text>
</g></svg>