<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">并查集路径压缩与按大小合并</title>
  <desc id="desc">展示未优化合并如何形成长链，Find 路径压缩如何让沿途节点直接指向根，以及按大小合并如何避免树再次变高。</desc>
  <defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#607086"/></marker></defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700">并查集：Find 找代表，Union 合集合，两种优化把树压平</text>
    <text x="72" y="101" fill="#607086" font-size="18">路径压缩优化“查”，按秩或按大小合并优化“并”，组合后均摊复杂度接近 O(1)。</text>

    <rect x="72" y="146" width="628" height="376" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="100" y="184" fill="#B91C1C" font-size="21" font-weight="700">未优化：合并顺序可能形成长链</text>
    <g transform="translate(126 246)">
      <circle cx="30" cy="40" r="28" fill="#DBEAFE"/><text x="30" y="47" text-anchor="middle" fill="#1D4ED8" font-size="17" font-weight="700">0</text>
      <line x1="58" y1="40" x2="116" y2="40" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <circle cx="146" cy="40" r="28" fill="#CCFBF1"/><text x="146" y="47" text-anchor="middle" fill="#0F766E" font-size="17" font-weight="700">1</text>
      <line x1="174" y1="40" x2="232" y2="40" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <circle cx="262" cy="40" r="28" fill="#FFF4DD"/><text x="262" y="47" text-anchor="middle" fill="#92400E" font-size="17" font-weight="700">2</text>
      <line x1="290" y1="40" x2="348" y2="40" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <circle cx="378" cy="40" r="28" fill="#F1EAFE"/><text x="378" y="47" text-anchor="middle" fill="#5720A3" font-size="17" font-weight="700">3</text>
      <line x1="406" y1="40" x2="464" y2="40" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
      <circle cx="494" cy="40" r="31" fill="#172033"/><text x="494" y="47" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">4 根</text>
    </g>
    <rect x="100" y="350" width="572" height="68" rx="6" fill="#FEE2E2"/>
    <text x="386" y="378" text-anchor="middle" fill="#B91C1C" font-size="16" font-weight="700">find(0) 要经过 0 → 1 → 2 → 3 → 4</text>
    <text x="386" y="402" text-anchor="middle" fill="#7F1D1D" font-size="13">最坏退化为 O(n)</text>
    <text x="100" y="478" fill="#607086" font-size="14">parent[i] 保存父节点；parent[root] = root。</text>

    <rect x="740" y="146" width="628" height="376" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="768" y="184" fill="#0B5E57" font-size="21" font-weight="700">find(0) 后：路径压缩</text>
    <g transform="translate(860 220)">
      <circle cx="190" cy="52" r="36" fill="#172033"/><text x="190" y="59" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">4 根</text>
      <g fill="none" stroke="#0F766E" stroke-width="3" marker-end="url(#arrow)">
        <line x1="24" y1="196" x2="164" y2="79"/><line x1="108" y1="196" x2="176" y2="86"/>
        <line x1="272" y1="196" x2="204" y2="86"/><line x1="356" y1="196" x2="216" y2="79"/>
      </g>
      <g font-size="17" font-weight="700" text-anchor="middle">
        <circle cx="24" cy="208" r="27" fill="#DBEAFE"/><text x="24" y="215" fill="#1D4ED8">0</text>
        <circle cx="108" cy="208" r="27" fill="#CCFBF1"/><text x="108" y="215" fill="#0F766E">1</text>
        <circle cx="272" cy="208" r="27" fill="#FFF4DD"/><text x="272" y="215" fill="#92400E">2</text>
        <circle cx="356" cy="208" r="27" fill="#F1EAFE"/><text x="356" y="215" fill="#5720A3">3</text>
      </g>
    </g>
    <rect x="768" y="440" width="572" height="54" rx="6" fill="#E7F8F4"/>
    <text x="1054" y="473" text-anchor="middle" fill="#0B5E57" font-size="15" font-weight="700">递归返回时执行 parent[x] = root，后续查询只走一跳</text>

    <text x="72" y="584" fill="#172033" font-size="22" font-weight="700">Union：先找根，再把小树挂到大树</text>
    <rect x="72" y="614" width="1296" height="220" rx="8" fill="#172033"/>
    <g transform="translate(104 658)">
      <rect width="246" height="98" rx="7" fill="#E8F0FF"/>
      <text x="123" y="32" text-anchor="middle" fill="#1D4ED8" font-size="16" font-weight="700">root_x = find(x)</text>
      <text x="123" y="61" text-anchor="middle" fill="#42669B" font-size="13">先压缩 x 的路径</text>
      <text x="123" y="82" text-anchor="middle" fill="#42669B" font-size="13">root_y = find(y)</text>
      <line x1="246" y1="49" x2="300" y2="49" stroke="#D7DFEA" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="300" width="270" height="98" rx="7" fill="#FFF4DD"/>
      <text x="435" y="32" text-anchor="middle" fill="#92400E" font-size="16" font-weight="700">比较 size / rank</text>
      <text x="435" y="61" text-anchor="middle" fill="#805B28" font-size="13">若根相同：已经连通，不合并</text>
      <text x="435" y="82" text-anchor="middle" fill="#805B28" font-size="13">若不同：选择更稳的挂接方向</text>
      <line x1="570" y1="49" x2="624" y2="49" stroke="#D7DFEA" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="624" width="270" height="98" rx="7" fill="#CCFBF1"/>
      <text x="759" y="32" text-anchor="middle" fill="#0B5E57" font-size="16" font-weight="700">小树根 → 大树根</text>
      <text x="759" y="61" text-anchor="middle" fill="#356C67" font-size="13">更新 size / rank</text>
      <text x="759" y="82" text-anchor="middle" fill="#356C67" font-size="13">集合数 count - 1</text>
      <line x1="894" y1="49" x2="948" y2="49" stroke="#D7DFEA" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="948" width="264" height="98" rx="7" fill="#F1EAFE"/>
      <text x="1080" y="32" text-anchor="middle" fill="#5720A3" font-size="16" font-weight="700">动态连通性</text>
      <text x="1080" y="61" text-anchor="middle" fill="#6A4B93" font-size="13">连通分量 · 环检测</text>
      <text x="1080" y="82" text-anchor="middle" fill="#6A4B93" font-size="13">Kruskal 最小生成树</text>
    </g>
    <text x="720" y="806" text-anchor="middle" fill="#D7DFEA" font-size="14">路径压缩 + 按秩/大小合并：单次操作均摊 O(α(n))，实践中近似常数。</text>
    <text x="720" y="874" text-anchor="middle" fill="#607086" font-size="15">并查集适合“边不断加入后的连通关系”，不直接支持任意删除边或恢复完整路径。</text>
  </g>
</svg>
