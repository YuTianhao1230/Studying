<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">对抗攻击威胁模型</title>
  <desc id="desc">威胁模型由模型访问、可修改输入、攻击预算和成功标准组成。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0F766E"/></marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B45309"/></marker>
    <marker id="arrow-red" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#B91C1C"/></marker>
    <marker id="arrow-purple" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#6D28D9"/></marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700" text-anchor="start">对抗评估先写威胁模型：能看什么、能改什么、预算多少、怎样算成功</text><text x="72" y="101" fill="#607086" font-size="18" font-weight="400" text-anchor="start">不同权限和预算回答的是不同安全问题，结果不能直接横向比较。</text><rect x="540" y="310" width="360" height="180" rx="8" fill="#172033" stroke="#172033"/><text x="720.0" y="346" fill="#FFFFFF" font-size="19" font-weight="700" text-anchor="middle">攻击实验</text><text x="720.0" y="376" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="720.0" dy="0">模型 f / 输入 x / 任务目标</tspan><tspan x="720.0" dy="22">固定预处理与评估协议</tspan></text><rect x="72" y="170" width="360" height="160" rx="8" fill="#E8F0FF" stroke="#2563EB"/><text x="252.0" y="206" fill="#2563EB" font-size="19" font-weight="700" text-anchor="middle">模型访问</text><text x="252.0" y="236" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="252.0" dy="0">白盒：参数 / 梯度</tspan><tspan x="252.0" dy="22">黑盒：分数 / 标签 / 零查询迁移</tspan></text><rect x="1008" y="170" width="360" height="160" rx="8" fill="#F1EAFE" stroke="#6D28D9"/><text x="1188.0" y="206" fill="#6D28D9" font-size="19" font-weight="700" text-anchor="middle">可修改输入</text><text x="1188.0" y="236" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1188.0" dy="0">图像 / 文本 / 音频</tspan><tspan x="1188.0" dy="22">单模态或联合；语义保持约束</tspan></text><rect x="72" y="518" width="360" height="160" rx="8" fill="#FFF4DD" stroke="#B45309"/><text x="252.0" y="554" fill="#B45309" font-size="19" font-weight="700" text-anchor="middle">攻击预算</text><text x="252.0" y="584" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="252.0" dy="0">L∞ / L2 / 编辑率</tspan><tspan x="252.0" dy="22">查询次数 / 步数 / 时间</tspan></text><rect x="1008" y="518" width="360" height="160" rx="8" fill="#ECFDF3" stroke="#15803D"/><text x="1188.0" y="554" fill="#15803D" font-size="19" font-weight="700" text-anchor="middle">成功标准</text><text x="1188.0" y="584" fill="#607086" font-size="14" font-weight="400" text-anchor="middle"><tspan x="1188.0" dy="0">非定向 / 定向 / 任务退化</tspan><tspan x="1188.0" dy="22">ASR 分母只含 clean 可攻击样本</tspan></text><path d="M432 250 C500 250 490 350 532 370" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M1008 250 C940 250 950 350 908 370" fill="none" stroke="#6D28D9" stroke-width="3" marker-end="url(#arrow-purple)"/><path d="M432 598 C500 598 490 472 532 442" fill="none" stroke="#B45309" stroke-width="3" marker-end="url(#arrow-orange)"/><path d="M1008 598 C940 598 950 472 908 442" fill="none" stroke="#15803D" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="72" y="742" width="1296" height="102" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/><text x="100" y="780" fill="#172033" font-size="18" font-weight="700" text-anchor="start">公平比较还需固定</text><text x="300" y="780" fill="#2563EB" font-size="15" font-weight="700" text-anchor="start">数据与样本过滤</text><text x="520" y="780" fill="#6D28D9" font-size="15" font-weight="700" text-anchor="start">目标模型版本</text><text x="720" y="780" fill="#0F766E" font-size="15" font-weight="700" text-anchor="start">预处理与解码</text><text x="920" y="780" fill="#B45309" font-size="15" font-weight="700" text-anchor="start">攻击超参数</text><text x="1110" y="780" fill="#15803D" font-size="15" font-weight="700" text-anchor="start">Judge 与指标口径</text><text x="720" y="822" fill="#607086" font-size="15" font-weight="400" text-anchor="middle">必须同时报告 clean 性能、扰动合规性、ASR / robust 指标和失败样本。</text>
  </g>
</svg>
