<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="570" viewBox="0 0 1700 570"><rect width="100%" height="100%" fill="#f6f3ed"/><g font-family="Droid Sans Fallback,DejaVu Sans,sans-serif">
<text x="45" y="70" font-size="32" fill="#182d3d">明朝关键节点</text>
<text x="45" y="115" font-size="21" fill="#526473">横轴按首个标注年份定位；并列日期在同一节点说明。公元纪年无0年。</text>
<path d="M100 290H1600" stroke="#849893" stroke-width="4"/>
<path d="M100.0 290L135.0 215" stroke="#b7b2a7" stroke-width="2"/><circle cx="100.0" cy="290" r="7" fill="#9d5e3e"/><text x="55.0" y="173" font-size="21" fill="#9d5e3e">1368／1380年</text>
<text x="55.0" y="207" font-size="22" fill="#182d3d">明建立／废丞相</text>
<path d="M327.9 290L430.0 345" stroke="#b7b2a7" stroke-width="2"/><circle cx="327.9" cy="290" r="7" fill="#9d5e3e"/><text x="350.0" y="378" font-size="21" fill="#9d5e3e">1399—1402年</text>
<text x="350.0" y="412" font-size="22" fill="#182d3d">靖难之役</text>
<path d="M372.1 290L800.0 215" stroke="#b7b2a7" stroke-width="2"/><circle cx="372.1" cy="290" r="7" fill="#9d5e3e"/><text x="720.0" y="173" font-size="21" fill="#9d5e3e">1405—1433年</text>
<text x="720.0" y="207" font-size="22" fill="#182d3d">郑和七下西洋</text>
<path d="M489.7 290L1170.0 345" stroke="#b7b2a7" stroke-width="2"/><circle cx="489.7" cy="290" r="7" fill="#9d5e3e"/><text x="1090.0" y="378" font-size="21" fill="#9d5e3e">1421年</text>
<text x="1090.0" y="412" font-size="22" fill="#182d3d">迁都北京</text>
<path d="M1600.0 290L1480.0 215" stroke="#b7b2a7" stroke-width="2"/><circle cx="1600.0" cy="290" r="7" fill="#9d5e3e"/><text x="1400.0" y="173" font-size="21" fill="#9d5e3e">1572年以后／1644年</text>
<text x="1400.0" y="207" font-size="22" fill="#182d3d">张居正主政改革／北京明</text>
<text x="1400.0" y="235" font-size="22" fill="#182d3d">朝中央覆亡</text>
</g></svg>