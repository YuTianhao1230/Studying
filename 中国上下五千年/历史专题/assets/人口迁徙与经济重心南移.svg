<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect width="1000" height="560" fill="#f8f6f1"/>
  <text x="50" y="52" font-family="sans-serif" font-size="28" fill="#222">人口迁徙与经济重心南移示意</text>
  <text x="50" y="82" font-family="sans-serif" font-size="15" fill="#666">多轮方向叠加，不表示一次迁徙或精确规模</text>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9e3d2f"/></marker></defs>
  <g stroke="#9e3d2f" stroke-width="5" fill="none" marker-end="url(#m)">
    <path d="M250 150 C280 235 330 270 390 345"/>
    <path d="M470 145 C480 235 505 285 530 370"/>
    <path d="M700 165 C680 260 660 320 630 420"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="250" y="125" font-size="19" fill="#222">东汉末—东晋</text>
    <text x="470" y="120" font-size="19" fill="#222">安史之乱—唐末五代</text>
    <text x="700" y="140" font-size="19" fill="#222">靖康之变—南宋</text>
    <rect x="260" y="335" width="500" height="125" rx="4" fill="#dceadf" stroke="#57906a"/>
    <text x="510" y="375" font-size="22" fill="#285f40">长江流域与东南地区</text>
    <text x="510" y="410" font-size="17" fill="#3f604c">人口、农业、水利、城市、手工业与商业长期发展</text>
    <text x="510" y="438" font-size="15" fill="#666">本地社会与迁入人群共同塑造变化</text>
  </g>
  <text x="50" y="520" font-family="sans-serif" font-size="14" fill="#666">经济重心需用人口、粮赋、城市、商业等多个指标综合判断。</text>
</svg>
