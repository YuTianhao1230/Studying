<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Speculative Decoding 草拟与验证流程</title>
  <desc id="desc">小型 Draft Model 串行提出多个候选，大型 Target Model 一次并行验证，连续接受前缀并在第一个拒绝位置修正采样。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#607086"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700">Speculative Decoding：小模型多走几步，大模型一次验一段</text>
    <text x="72" y="101" fill="#607086" font-size="18">Draft 只负责提案；严格采样中，接受、拒绝与修正都由 Target 概率决定。</text>

    <rect x="72" y="146" width="1296" height="158" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="132" cy="194" r="23" fill="#2563EB"/>
    <text x="132" y="201" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">1</text>
    <text x="172" y="201" fill="#172033" font-size="20" font-weight="700">Draft Model 快速草拟 γ 个 token</text>
    <rect x="382" y="224" width="150" height="52" rx="7" fill="#DBEAFE" stroke="#93B4F5"/>
    <rect x="548" y="224" width="150" height="52" rx="7" fill="#DBEAFE" stroke="#93B4F5"/>
    <rect x="714" y="224" width="150" height="52" rx="7" fill="#DBEAFE" stroke="#93B4F5"/>
    <rect x="880" y="224" width="150" height="52" rx="7" fill="#DBEAFE" stroke="#93B4F5"/>
    <text x="457" y="256" text-anchor="middle" fill="#1D4ED8" font-size="16" font-weight="700">候选 x₁</text>
    <text x="623" y="256" text-anchor="middle" fill="#1D4ED8" font-size="16" font-weight="700">候选 x₂</text>
    <text x="789" y="256" text-anchor="middle" fill="#1D4ED8" font-size="16" font-weight="700">候选 x₃</text>
    <text x="955" y="256" text-anchor="middle" fill="#1D4ED8" font-size="16" font-weight="700">候选 x₄</text>
    <text x="1100" y="256" fill="#607086" font-size="15">Draft 成本较低</text>

    <line x1="720" y1="304" x2="720" y2="356" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="72" y="376" width="1296" height="186" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="132" cy="424" r="23" fill="#6D28D9"/>
    <text x="132" y="431" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">2</text>
    <text x="172" y="431" fill="#172033" font-size="20" font-weight="700">Target Model 一次前向并行计算这些位置的分布</text>
    <rect x="274" y="464" width="892" height="66" rx="8" fill="#F1EAFE" stroke="#B69AE8"/>
    <text x="720" y="490" text-anchor="middle" fill="#5720A3" font-size="18" font-weight="700">P_target(x₁ | context), P_target(x₂ | context+x₁), …</text>
    <text x="720" y="516" text-anchor="middle" fill="#6A4B93" font-size="14">验证多个位置可并行，减少昂贵 Target Decode 的串行轮数</text>

    <line x1="720" y1="562" x2="720" y2="614" stroke="#607086" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="72" y="634" width="1296" height="158" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="132" cy="682" r="23" fill="#0F766E"/>
    <text x="132" y="689" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="700">3</text>
    <text x="172" y="689" fill="#172033" font-size="20" font-weight="700">从左到右连续接受；遇到首个拒绝位置就停止</text>
    <rect x="336" y="716" width="150" height="48" rx="7" fill="#CCFBF1" stroke="#7BC7B9"/>
    <rect x="502" y="716" width="150" height="48" rx="7" fill="#CCFBF1" stroke="#7BC7B9"/>
    <rect x="668" y="716" width="150" height="48" rx="7" fill="#FFE4E6" stroke="#DB8DA5"/>
    <rect x="834" y="716" width="150" height="48" rx="7" fill="#EEF2F6" stroke="#CBD5E1"/>
    <rect x="1000" y="716" width="190" height="48" rx="7" fill="#FFF4DD" stroke="#E4B55B"/>
    <text x="411" y="746" text-anchor="middle" fill="#0F766E" font-size="15" font-weight="700">x₁ 接受</text>
    <text x="577" y="746" text-anchor="middle" fill="#0F766E" font-size="15" font-weight="700">x₂ 接受</text>
    <text x="743" y="746" text-anchor="middle" fill="#BE123C" font-size="15" font-weight="700">x₃ 拒绝</text>
    <text x="909" y="746" text-anchor="middle" fill="#64748B" font-size="15">x₄ 丢弃</text>
    <text x="1095" y="746" text-anchor="middle" fill="#B45309" font-size="15" font-weight="700">修正采样 y</text>

    <rect x="72" y="826" width="1296" height="48" rx="8" fill="#172033"/>
    <text x="320" y="856" text-anchor="middle" fill="#7BC7B9" font-size="16" font-weight="700">收益核心：每次 Target 验证平均接受几个 token</text>
    <text x="1020" y="856" text-anchor="middle" fill="#D7DFEA" font-size="15">低接受率、短输出或 Draft 太贵时，可能不加速反而变慢</text>
  </g>
</svg>
