<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Static Dynamic Continuous Batching 对比</title>
  <desc id="desc">静态批处理整批同进同出，动态批处理在短窗口内收集请求，连续批处理允许生成请求逐步进入和退出批次。</desc>
  <rect width="1440" height="900" fill="#F5F7FA"/>
  <g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, PingFang SC, sans-serif">
    <text x="72" y="64" fill="#172033" font-size="34" font-weight="700">Batching：从“整批等待”到“请求动态进出”</text>
    <text x="72" y="101" fill="#607086" font-size="18">横轴是 GPU 执行时间；每条色带表示一个请求占用的计算槽位。</text>

    <rect x="72" y="146" width="1296" height="194" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="96" y="170" width="160" height="34" rx="6" fill="#DBEAFE"/>
    <text x="176" y="193" text-anchor="middle" fill="#1D4ED8" font-size="16" font-weight="700">Static Batching</text>
    <text x="280" y="193" fill="#172033" font-size="19" font-weight="700">凑够固定 batch，整批同进同出</text>
    <line x1="298" y1="306" x2="1278" y2="306" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1278" y="326" text-anchor="end" fill="#94A3B8" font-size="13">time →</text>
    <rect x="322" y="226" width="614" height="24" rx="4" fill="#DBEAFE"/>
    <rect x="322" y="258" width="614" height="24" rx="4" fill="#CCFBF1"/>
    <rect x="322" y="290" width="614" height="24" rx="4" fill="#FEF3C7"/>
    <text x="108" y="244" fill="#355986" font-size="14">A：短请求</text>
    <text x="108" y="276" fill="#356C67" font-size="14">B：中请求</text>
    <text x="108" y="308" fill="#805B28" font-size="14">C：长请求</text>
    <rect x="528" y="226" width="408" height="24" fill="#F1F5F9" opacity="0.92"/>
    <rect x="756" y="258" width="180" height="24" fill="#F1F5F9" opacity="0.92"/>
    <text x="1140" y="250" text-anchor="middle" fill="#BE123C" font-size="16" font-weight="700">短请求结束后仍占槽位</text>
    <text x="1140" y="278" text-anchor="middle" fill="#607086" font-size="14">Padding / GPU 空转</text>

    <rect x="72" y="364" width="1296" height="194" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="96" y="388" width="172" height="34" rx="6" fill="#F1EAFE"/>
    <text x="182" y="411" text-anchor="middle" fill="#6D28D9" font-size="16" font-weight="700">Dynamic Batching</text>
    <text x="292" y="411" fill="#172033" font-size="19" font-weight="700">短窗口收集请求，再组成一批执行</text>
    <rect x="320" y="446" width="142" height="72" rx="8" fill="#F1EAFE" stroke="#B69AE8"/>
    <text x="391" y="474" text-anchor="middle" fill="#5720A3" font-size="16" font-weight="700">等待窗口</text>
    <text x="391" y="500" text-anchor="middle" fill="#6A4B93" font-size="14">例如 5 ms</text>
    <rect x="486" y="446" width="162" height="30" rx="5" fill="#DBEAFE"/>
    <rect x="486" y="488" width="162" height="30" rx="5" fill="#CCFBF1"/>
    <rect x="676" y="446" width="162" height="30" rx="5" fill="#FEF3C7"/>
    <text x="567" y="466" text-anchor="middle" fill="#1D4ED8" font-size="14">请求 A / B</text>
    <text x="567" y="508" text-anchor="middle" fill="#0F766E" font-size="14">组成 Batch 1</text>
    <text x="757" y="466" text-anchor="middle" fill="#B45309" font-size="14">稍后到达 C</text>
    <text x="1048" y="466" fill="#5720A3" font-size="16" font-weight="700">窗口大：batch 更大、排队更久</text>
    <text x="1048" y="503" fill="#607086" font-size="16">窗口小：延迟更低、吞吐可能不足</text>

    <rect x="72" y="582" width="1296" height="226" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="96" y="606" width="194" height="34" rx="6" fill="#CCFBF1"/>
    <text x="193" y="629" text-anchor="middle" fill="#0F766E" font-size="16" font-weight="700">Continuous Batching</text>
    <text x="314" y="629" fill="#172033" font-size="19" font-weight="700">每轮 Decode 后都可移出完成请求、补入新请求</text>
    <line x1="298" y1="770" x2="1278" y2="770" stroke="#CBD5E1" stroke-width="2"/>
    <text x="1278" y="791" text-anchor="end" fill="#94A3B8" font-size="13">decode step →</text>
    <g fill="#607086" font-size="13" text-anchor="middle">
      <text x="380" y="674">1</text><text x="510" y="674">2</text><text x="640" y="674">3</text>
      <text x="770" y="674">4</text><text x="900" y="674">5</text><text x="1030" y="674">6</text><text x="1160" y="674">7</text>
    </g>
    <rect x="316" y="690" width="334" height="24" rx="4" fill="#DBEAFE"/>
    <rect x="316" y="722" width="594" height="24" rx="4" fill="#CCFBF1"/>
    <rect x="660" y="690" width="500" height="24" rx="4" fill="#FEF3C7"/>
    <text x="108" y="708" fill="#355986" font-size="14">A 完成</text>
    <text x="108" y="740" fill="#356C67" font-size="14">B 继续</text>
    <text x="1184" y="708" fill="#805B28" font-size="14">A 退出后，C 立即补入</text>
    <line x1="650" y1="682" x2="650" y2="752" stroke="#BE123C" stroke-width="2" stroke-dasharray="5 5"/>

    <rect x="72" y="840" width="1296" height="40" rx="8" fill="#172033"/>
    <text x="720" y="866" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">在线 LLM 通常依赖 Continuous Batching：目标是让每个 Decode step 的有效槽位尽量满</text>
  </g>
</svg>
